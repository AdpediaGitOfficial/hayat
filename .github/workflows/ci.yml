name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: platform (typecheck, lint, migrate, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gh_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gh_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations are applied to this database; tests create and drop their own throwaway databases
      # through the admin connection, so they never touch it.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gh_platform
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Apply migrations
        run: npm run db:migrate
      - name: Re-apply migrations (must be a no-op)
        run: npm run db:migrate
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  prototype:
    name: prototype (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
