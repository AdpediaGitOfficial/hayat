FORMS.allocate = (f) => {
  const m = S.ui.modal;
  const d = Object.assign(m.data, f);
  if (m.step === 1) {
    if (!d.staffId) fail('Pick a staff member.');
    if (!d.start) fail('Start date is required.');
    if (d.start < TODAY) fail('The start date cannot be in the past.');
    if (d.end && d.end <= d.start) fail('The end date must be after the start date.');
    if (!d.end && !S.settings.openEnded) fail('Open-ended stays are switched off. Add an end date.');
    if (d.kind !== 'staff' && !String(d.guestName || '').trim()) fail('Guest full name is required.');
    if (d.kind === 'staff') { const sc = staffConflicts(S, d.staffId, d.start, d.end || null, []); if (sc.length) fail(staffName(S, d.staffId) + ' already has ' + bedLabel(S, sc[0].bedId) + ' for these dates. Use a transfer instead.'); }
    if (d.bedId && bedConflicts(S, d.bedId, d.start, d.end || null).length) d.bedId = '';
    m.step = 2; m.values = d; m.error = null; return 'stay';
  }
  if (m.step === 2) {
    if (!d.bedId) fail('Pick a bed from the list.');
    m.step = 3; m.values = d; m.error = null; return 'stay';

function requestFields(type, data) {
  return REQUEST_TYPES[type].fields.map((fd) => {

  }).join('');
}

MODALS.request = (m) => {
  const r = byId(S.requests, m.id);
  const t = REQUEST_TYPES[r.type];
  const st = byId(S.staff, r.staffId);
  const last = r.stage >= r.stages.length - 1;
  const cur = currentAlloc(S, r.staffId);
  const open = r.status === 'pending_approval';
  let bedPick = '';
  if (open && last && t.needsBed) {
    let start = TODAY; let end = null; let kind = 'staff';
    if (r.type === 'room_change') { start = val('effDate', r.data.moveDate < TODAY ? TODAY : r.data.moveDate); end = cur ? cur.end : null; }
    if (r.type === 'visitor_stay') { start = r.data.arrival; end = r.data.departure; kind = 'visitor'; }
    if (r.type === 'family_accommodation') { start = r.data.start; end = r.data.end || null; kind = 'family'; }
    const flt = { buildingId: val('fBuilding', r.data.preferredBuilding || '') };
    let beds = availableBeds(S, start, end, flt).filter((b) => !cur || b.id !== cur.bedId);
    if (kind === 'staff') beds = beds.filter((b) => policyWarnings(S, r.staffId, b.id, 'staff').length === 0);
    bedPick = '<fieldset class="fieldset"><legend>Fulfil on approval: ' + esc(t.action.toLowerCase()) + '</legend><div class="form-grid">' +
      (r.type === 'room_change' ? fInput('effDate', 'Effective date', { type: 'date', value: start, min: TODAY }) : '') +
      fSelect('fBuilding', 'Building', buildingOpts(), { value: flt.buildingId, placeholder: 'Any building', act: 'formChange' }) + '</div>' +
      '<span class="small muted">Free from ' + fmtDate(start) + ' to ' + fmtDate(end) + (kind === 'staff' ? ', matching ' + esc(st.first) + '\u2019s room policy' : '') + '. Needed only if you approve.</span>' + bedPickList('bedId', beds, val('bedId', ''), kind === 'family' ? r.staffId : null, kind) +
      (kind === 'family' ? fText('overrideReason', 'Override reason if the room is not a family room', { rows: 2 }) : '') + '</fieldset>';
  }
  const fields = t.fields.map((fd) => '<dt>' + esc(fd.label) + '</dt><dd style="white-space:pre-line">' + esc(fd.type === 'date' ? fmtDate(r.data[fd.key] || null) : fd.type === 'building' ? (r.data[fd.key] ? byId(S.buildings, r.data[fd.key]).name : 'No preference') : (r.data[fd.key] || '\u2014')) + '</dd>').join('');
  const stepsHtml = r.stages.map((name, i) => {
    const decided = r.steps.filter((s) => s.stage === i && ['approve', 'reject', 'changes'].includes(s.decision)).slice(-1)[0];
    const cls = decided ? (decided.decision === 'approve' ? '' : 'bad') : (i === r.stage && open ? 'now' : 'todo');
    return '<li><span class="rail"><i class="' + cls + '"></i>' + (i < r.stages.length - 1 ? '<b></b>' : '') + '</span><span class="body"><b>' + esc(name) + '</b><span class="muted small">' + (decided ? esc(decided.by) + ' ' + ({ approve: 'approved', reject: 'rejected', changes: 'asked for changes' }[decided.decision]) + ' \u00b7 ' + fmtStamp(decided.at) : i === r.stage && open ? 'Waiting \u00b7 you can decide as ' + esc(name) : 'Not started') + '</span>' + (decided && decided.comment ? '<span class="small">\u201c' + esc(decided.comment) + '\u201d</span>' : '') + '</span></li>';
  }).join('');
  return {
    title: t.name + ' \u00b7 ' + r.no, sub: staffName(S, r.staffId) + ' \u00b7 ' + st.empId + (cur ? ' \u00b7 currently ' + bedLabel(S, cur.bedId) : ' \u00b7 no current bed') + ' \u00b7 submitted ' + fmtStamp(r.submitted), drawer: true, form: open ? 'decide' : false,
    body: '<div class="row">' + reqPill(r) + '<span class="small muted">Route version ' + r.workflowVersion + ' (pinned at submission)</span></div>' +
      '<div class="stack tight"><h3>Submitted details</h3><dl class="kv">' + fields + '</dl></div>' +
      (r.revisions.length ? '<div class="hint">Resubmitted ' + r.revisions.length + ' time(s). Earlier answers are kept.</div>' : '') +
      '<div class="stack tight"><h3>Approval route</h3><ol class="timeline">' + stepsHtml + '</ol></div>' +
      (r.fulfilment ? '<div class="alert ok"><b>Done:</b> ' + esc(r.fulfilment.text) + '</div>' : '') +
      (open ? bedPick + '<fieldset class="fieldset"><legend>Your decision' + (last ? ' (final stage)' : ' (stage ' + (r.stage + 1) + ' of ' + r.stages.length + ')') + '</legend>' +
        '<div class="checks" role="radiogroup">' + [['approve', last ? 'Approve and ' + t.action.toLowerCase() : 'Approve and send to ' + r.stages[r.stage + 1]], ['changes', 'Ask the requester for changes'], ['reject', 'Reject']].map(([v, l]) => '<label class="check"><input type="radio" name="decision" value="' + v + '"' + (val('decision', 'approve') === v ? ' checked' : '') + '><span>' + esc(l) + '</span></label>').join('') + '</div>' +
        fText('comment', 'Comment to the requester', { rows: 2, help: 'Required when you reject or ask for changes.' }) + '</fieldset>' : ''),
    foot: open ? btnCancel + submit('Submit decision') : (['pending_approval', 'changes_requested'].includes(r.status) ? '' : '<button type="button" class="btn" data-act="closeModal">Close</button>')
  };
};
FORMS.decide = (f) => {
  const m = S.ui.modal;
  const r = byId(S.requests, m.id);
  const last = r.stage >= r.stages.length - 1;
  if (f.decision === 'approve' && last && REQUEST_TYPES[r.type].needsBed && !f.bedId) fail('Pick the bed to use before approving.');
  opDecide(S, m.id, f);
  done(f.decision === 'approve' ? (last ? 'Approved. ' + (r.fulfilment ? r.fulfilment.text + '.' : '') : 'Approved. Sent to ' + r.stages[r.stage] + '.') : f.decision === 'reject' ? 'Rejected. The requester was told why.' : 'Returned to the requester for changes.');
};

/* ---------- maintenance ---------- */
MODALS.newTicket = () => ({
  title: 'New maintenance ticket', sub: 'For issues reported at reception or found on inspection.', form: true, size: 'wide',
  body: '<div class="form-grid">' + fSelect('roomId', 'Room', roomOpts(), { required: true, value: val('roomId', ''), placeholder: 'Choose' }) + fInput('location', 'Exact spot', { placeholder: 'e.g. Bathroom ceiling' }) +
    fSelect('category', 'Category', S.categories, { required: true, value: '', placeholder: 'Choose' }) + fSelect('urgency', 'Urgency', URGENCY, { required: true, value: 'normal' }) +
    fInput('title', 'Short title', { required: true, full: true, placeholder: 'e.g. Water leaking from ceiling' }) + fText('description', 'Description', { required: true, rows: 3 }) +
    fSelect('staffId', 'Reported by (resident)', staffOpts(), { value: '', placeholder: 'Staff on duty' }) + fSelect('contact', 'Preferred contact', CONTACT, { value: 'in_app' }) + fSelect('access', 'Room access', ACCESS, { value: 'call_first' }) + fFile('photoName', 'Photo') + '</div>',
  foot: btnCancel + submit('Create ticket')
});
FORMS.newTicket = (f) => { const t = opCreateTicket(S, f, f.staffId || null, 'admin'); done(t.no + ' created.'); };

MODALS.ticket = (m) => {
  const t = byId(S.tickets, m.id);
  const room = byId(S.rooms, t.roomId);
  const nextStates = { new: ['triaged', 'assigned', 'cancelled'], triaged: ['assigned', 'cancelled'], assigned: ['in_progress', 'waiting_access', 'resolved'], in_progress: ['waiting_parts', 'waiting_access', 'waiting_staff', 'resolved'], waiting_parts: ['in_progress', 'resolved'], waiting_access: ['in_progress', 'resolved'], waiting_staff: ['in_progress', 'resolved'], reopened: ['assigned', 'in_progress', 'resolved'], resolved: [], closed: [], cancelled: [] }[t.status] || [];
  const editable = nextStates.length > 0;
  return {
    title: t.title, sub: t.no + ' \u00b7 ' + room.no + (t.location ? ' \u00b7 ' + t.location : '') + ' \u00b7 ' + bedWhere(S, (S.beds.find((b) => b.roomId === room.id) || {}).id), drawer: true, form: editable ? true : false,
    body: '<div class="row">' + pill(TICKET_TONE[t.status], TICKET_LABEL[t.status]) + pill(URG_TONE[t.urgency], label(URGENCY, t.urgency)) + (t.priority ? '<span class="chip">' + esc(t.priority) + '</span>' : '') + (t.blockRoom ? pill('danger', 'Room blocked') : '') + '</div>' +
      '<dl class="kv"><dt>Category</dt><dd>' + esc(t.category) + '</dd><dt>Reported by</dt><dd>' + esc(t.requesterStaffId ? staffName(S, t.requesterStaffId) : 'Staff on duty') + '</dd><dt>Contact</dt><dd>' + esc(label(CONTACT, t.contact)) + '</dd><dt>Access</dt><dd>' + esc(label(ACCESS, t.access)) + '</dd><dt>Assigned to</dt><dd>' + esc(t.team || 'Unassigned') + '</dd><dt>Description</dt><dd>' + esc(t.description) + '</dd>' +
      (t.resolution ? '<dt>Resolution</dt><dd>' + esc(t.resolution) + '</dd>' : '') + (t.feedback ? '<dt>Resident rating</dt><dd>' + t.feedback.rating + '/5' + (t.feedback.comment ? ' \u00b7 ' + esc(t.feedback.comment) : '') + '</dd>' : '') + '</dl>' +
      '<div class="hint">' + (t.photo ? 'Photo attached: ' + esc(t.photo) : 'No photo attached.') + '</div>' +
      (editable ? '<fieldset class="fieldset"><legend>Update ticket</legend><div class="form-grid">' +
        fSelect('status', 'Move to', [[t.status, 'Keep as ' + TICKET_LABEL[t.status]]].concat(nextStates.map((s) => [s, TICKET_LABEL[s]])), { value: val('status', t.status) }) +
        fSelect('team', 'Assign to', S.teams, { value: t.team, placeholder: 'Unassigned' }) +
        fSelect('priority', 'Priority', [['P1', 'P1 \u00b7 within 4 hours'], ['P2', 'P2 \u00b7 within 1 day'], ['P3', 'P3 \u00b7 within 3 days'], ['P4', 'P4 \u00b7 within 7 days']], { value: t.priority, placeholder: 'Not set' }) +
        fSelect('urgency', 'Urgency', URGENCY, { value: t.urgency }) +
        fText('note', 'Progress note', { rows: 2, placeholder: 'What was done or what is next' }) +
        fText('resolution', 'Resolution note', { rows: 2, help: 'Required when you move the ticket to Resolved. The resident sees it.' }) + '</div>' +
        '<div class="checks">' + fCheck('visible', 'Show the progress note to the resident', true) + (t.blockRoom ? '' : fCheck('blockRoom', 'Block the room until this is fixed (only if nobody is staying in it)', false)) + '</div></fieldset>' : '') +
      '<div class="stack tight"><h3>Activity</h3><ol class="timeline">' + t.updates.slice().reverse().map((u, i, arr) => '<li><span class="rail"><i></i>' + (i < arr.length - 1 ? '<b></b>' : '') + '</span><span class="body"><b>' + esc(u.text) + '</b><span class="muted small">' + fmtStamp(u.at) + ' \u00b7 ' + esc(u.by) + '</span></span></li>').join('') + '</ol></div>',
    foot: editable ? btnCancel + submit('Save update') : '<span class="small muted left">' + (t.status === 'resolved' ? 'Waiting for the resident to confirm or reopen in the resident app.' : 'This ticket is ' + TICKET_LABEL[t.status].toLowerCase() + '.') + '</span><button type="button" class="btn" data-act="closeModal">Close</button>'
  };
};
FORMS.ticket = (f) => { const m = S.ui.modal; opTicketUpdate(S, m.id, f); done('Ticket updated.' + (f.status === 'resolved' ? ' The resident was asked to confirm the fix.' : '')); };

/* ---------- keys ---------- */
MODALS.registerKey = () => ({
  title: 'Register key', form: true,
  body: '<div class="form-grid">' + fInput('code', 'Key code', { required: true, placeholder: 'K-B-201-1', help: 'Unique, printed on the tag.' }) + fInput('label', 'What it opens', { required: true, placeholder: 'B-201 room door' }) +
    fSelect('kind', 'Kind', KEY_KINDS, { value: 'room' }) + fSelect('roomId', 'Room', roomOpts(), { value: '', placeholder: 'Not a room key' }) + fInput('copy', 'Copy number', { type: 'number', value: '1', min: '1' }) +
    fSelect('condition', 'Condition', CONDITIONS, { value: 'good' }) + fInput('custodian', 'Custodian', { value: 'Leila Farouk' }) + fInput('storage', 'Storage location', { placeholder: 'Cabinet B, hook 12' }) + '</div>',
  foot: btnCancel + submit('Register key')
});
FORMS.registerKey = (f) => { opRegisterKey(S, f); done('Key registered.'); };

MODALS.issueKey = (m) => {
  const k = byId(S.keys, m.id);
  return {
    title: 'Issue ' + k.code, sub: k.label, form: true, size: 'narrow',
    body: fSelect('staffId', 'Issue to staff member', staffOpts(), { value: '', placeholder: 'Someone else (type below)' }) + fInput('holderName', 'Or name of contractor or team', { placeholder: 'e.g. CoolAir technician' }) +
      fInput('due', 'Return by', { type: 'date', help: 'Leave empty for residents keeping it for their stay.' }) + fSelect('condition', 'Condition when issued', CONDITIONS, { value: k.condition }) + fText('notes', 'Notes', { rows: 2 }),
    foot: btnCancel + submit('Issue key')
  };
};
FORMS.issueKey = (f) => { opIssueKey(S, S.ui.modal.id, f); done('Key issued.'); };
MODALS.returnKey = (m) => {
  const k = byId(S.keys, m.id);
  return {
    title: 'Return ' + k.code, sub: 'Held by ' + (k.holder ? k.holder.name : '\u2014') + ' since ' + fmtDate(k.holder ? k.holder.since : null), form: true, size: 'narrow',
    body: fSelect('condition', 'Condition on return', CONDITIONS, { value: 'good', help: 'Damaged keys go to repair and cannot be issued.' }) + fText('notes', 'Notes', { rows: 2 }),
    foot: btnCancel + submit('Record return')
  };
};
FORMS.returnKey = (f) => { opReturnKey(S, S.ui.modal.id, f); done('Return recorded.'); };
MODALS.keyIncident = (m) => {
  const k = byId(S.keys, m.id);
  return {
    title: 'Report a problem with ' + k.code, sub: k.label + (k.holder ? ' \u00b7 held by ' + k.holder.name : ''), form: true, size: 'narrow',
    body: fSelect('type', 'What happened', [['lost', 'Lost'], ['damaged', 'Damaged'], ['under_repair', 'Sent for repair'], ['retired', 'Retired']], { value: 'lost' }) + fText('notes', 'Details', { required: true, rows: 3, placeholder: 'When and how, and whether the lock needs changing' }),
    foot: btnCancel + submit('Save report', 'danger')
  };
};
FORMS.keyIncident = (f) => { opKeyIncident(S, S.ui.modal.id, f); done('Recorded. The history keeps the original issue and this report.'); };

/* ---------- users, workflow, reference ---------- */
MODALS.user = (m) => {
  const u = m.id ? byId(S.users, m.id) : null;
  return {
    title: u ? 'Edit ' + u.name : 'Invite user', sub: 'People only see what their roles and site scope allow. Every change is audited.', form: true, size: 'wide',
    body: '<div class="form-grid">' + fInput('name', 'Full name', { required: true, value: u ? u.name : '' }) + fInput('email', 'Work email', { type: 'email', required: true, value: u ? u.email : '' }) + fInput('phone', 'Mobile', { type: 'tel', value: u ? u.phone : '' }) +
      fSelect('scope', 'Site scope', [['all', 'All sites']].concat(siteOpts()).concat([['own', 'Own records only (residents)']]), { value: u ? u.scope : 'all' }) +
      fSelect('staffId', 'Linked staff profile', staffOpts(), { value: u ? u.staffId || '' : '', placeholder: 'None', help: 'Needed for the Staff / resident role and for line-manager approvals.' }) + '</div>' +
      '<fieldset class="fieldset"><legend>Roles</legend><div class="form-grid">' + ROLES.map(([k, l]) => fCheck('role_' + k, esc(l), u ? u.roles.includes(k) : false)).join('') + '</div></fieldset>',
    foot: btnCancel + submit(u ? 'Save changes' : 'Send invitation')
  };
};
FORMS.user = (f) => { const m = S.ui.modal; opSaveUser(S, f, m.id); done(m.id ? 'User updated.' : 'Invitation sent.'); };
MODALS.deactivate = (m) => {
  const u = byId(S.users, m.id);
  return {
    title: 'Deactivate ' + u.name + '?', size: 'narrow',
    body: '<p>They are signed out everywhere straight away and cannot sign in again. Their history and audit records are kept.</p>',
    foot: btnCancel + '<button type="button" class="btn danger" data-act="userStatus" data-id="' + u.id + '" data-status="deactivated">Deactivate</button>'
  };
};
MODALS.workflow = (m) => {
  const w = S.workflows[m.type];
  return {
    title: 'Approval route: ' + REQUEST_TYPES[m.type].name, sub: 'Currently version ' + w.version + '. Saving creates version ' + (w.version + 1) + '; open requests keep their version.', form: true,
    body: fText('stages', 'Stages, in order, one per line', { rows: 4, value: w.stages.map((s) => s.name).join('\n'), help: 'Use role names such as Line manager, HR, Site admin, Key custodian, Finance.' }) +
      fCheck('selfApproval', 'Allow people to approve their own request', w.selfApproval) +
      '<div class="hint">Reasons are always required for \u201cReject\u201d and \u201cAsk for changes\u201d.</div>',
    foot: btnCancel + submit('Save new version')
  };
};
FORMS.workflow = (f) => { opSaveWorkflow(S, S.ui.modal.type, f); done('Route saved as a new version.'); };
MODALS.refAdd = (m) => ({
  title: 'Add to ' + m.title, form: true, size: 'narrow',
  body: fInput('name', 'Name', { required: true }),
  foot: btnCancel + submit('Add')
});
FORMS.refAdd = (f) => {
  const m = S.ui.modal;
  const name = req(f.name, 'Name');
  if (S[m.list].some((x) => x.toLowerCase() === name.toLowerCase())) fail(name + ' is already in the list.');
  S[m.list].push(name);
  audit(S, 'Reference data added', m.title, name);
  done(name + ' added.');
};
MODALS.export = (m) => {
  let csv = '';
  if (m.report === 'occupancy') csv = 'site,building,beds,occupied,reserved,vacant,blocked,occupancy_pct\n' + S.buildings.map((b) => { const c = occupancyCounts(activeBeds((r) => r.buildingId === b.id)); return [byId(S.sites, b.siteId).name, b.name, c.total, c.occupied, c.reserved, c.vacant, c.blocked, c.rate].join(','); }).join('\n');
  if (m.report === 'maintenance') csv = 'ticket,title,room,category,urgency,status,team\n' + S.tickets.map((t) => [t.no, '"' + t.title + '"', byId(S.rooms, t.roomId).no, t.category, t.urgency, t.status, t.team].join(',')).join('\n');
  if (m.report === 'movements') csv = 'allocation,employee_id,name,bed,start,end,status\n' + S.allocations.map((a) => [a.no, (byId(S.staff, a.staffId) || {}).empId, staffName(S, a.staffId), bedLabel(S, a.bedId), a.start, a.end || '', a.status].join(',')).join('\n');
  m.csv = csv;
  return {
    title: 'Export ' + m.report, sub: 'In the real app this downloads a CSV or XLSX file. Here you can copy it.',
    body: '<textarea id="export-csv" class="mono" rows="10" readonly>' + esc(csv) + '</textarea>',
    foot: '<button type="button" class="btn" data-act="closeModal">Close</button><button type="button" class="btn primary" data-act="copyExport">Copy CSV</button>'
  };
};

</script>
<script>
/* Staff Accommodation prototype: the resident's mobile app (Flutter in the real build), shown in a phone frame. */

function staffErr() {
  const sf = S.session.sf;
  return sf && sf.error ? '<div class="alert error" role="alert"><strong>Not sent. </strong>' + esc(sf.error) + '</div>' : '';
}
function sGo(screen, param) {
  S.session.staffScreen = screen;
  S.session.staffParam = param || null;
  S.session.sf = null;
  commit();
  const b = document.querySelector('.app-body'); if (b) b.scrollTop = 0;
}

function viewStaffMode() {
  const me = S.session.staffAs ? byId(S.staff, S.session.staffAs) : null;
  const note = '<aside class="card side-note"><div class="row between"><h2>Resident app</h2><span class="chip">Flutter</span></div>' +
    '<p class="small">This is what residents see on their phone. Everything here talks to the same data as the management portal, so a request or ticket raised here shows up for the admin straight away.</p>' +
    (me ? '<dl class="kv"><dt>Signed in as</dt><dd>' + esc(me.first + ' ' + me.last) + '</dd><dt>Bed</dt><dd>' + (currentAlloc(S, me.id) ? esc(bedLabel(S, currentAlloc(S, me.id).bedId)) : 'None') + '</dd></dl><button type="button" class="btn" data-act="staffSignOut">Sign in as someone else</button>' : '') +
    '<div class="hint small">Try: report an issue, confirm a fix, ask for a visitor stay, update your emergency contact. Then switch back to see it in the management portal.</div>' +
    '<button type="button" class="btn primary" data-act="toAdminMode">Back to the management portal</button></aside>';
  return '<div class="shell" style="flex-direction:column"><div class="row between" style="padding:6px 6px 0">' + brandBlock('Resident app preview', 'inline') + '' +
    '<div class="tabs" role="group" aria-label="Which app"><button type="button" aria-selected="false" data-act="toAdminMode">Management portal</button><button type="button" aria-selected="true">Resident app</button></div></div>' +
    '<div class="phone-stage"><div class="phone" aria-label="Phone preview"><div class="screen">' + (me ? staffScreen(me) : staffLogin()) + '</div></div>' + note + '</div></div>';
}

function staffLogin() {
  const residents = S.staff.filter((s) => s.status === 'active');
  const def = S.journey.allocate ? (S.allocations.slice().reverse().find((a) => a.kind === 'staff' && ['confirmed', 'checked_in'].includes(a.status)) || {}).staffId : 'st16';
  return '<div class="app-body" style="justify-content:center"><form class="stack" data-form="s_login" novalidate>' + brandBlock('Resident app') + '' +
    '<h1>Sign in</h1>' + fSelect('staffId', 'Who are you? (prototype)', residents.map((s) => [s.id, s.first + ' ' + s.last + ' \u00b7 ' + s.empId]), { value: def || 'st16' }) +
    '<div class="field"><label for="s-pass">Password</label><input id="s-pass" type="password" value="prototype"></div>' +
    '<button type="submit" class="btn primary">Sign in</button><button type="button" class="link small" data-act="toast" data-msg="A reset link would be sent to your work email or phone.">Forgot password?</button></form></div>';
}

function staffScreen(me) {
  const scr = S.session.staffScreen || 'home';
  const unread = S.notifications.filter((n) => n.to === me.id && !n.read).length;
  const titles = { home: 'Hi, ' + me.first, stay: 'My stay', requests: 'My requests', request: 'Request', newRequest: 'New request', tickets: 'My issues', ticket: 'Issue', report: 'Report an issue', notifs: 'Notifications', profile: 'Profile' };
  const back = ['request', 'newRequest', 'ticket', 'report', 'notifs'].includes(scr);
  const top = (scr === 'home' ? '<div class="app-brand">' + clientLogo() + '</div>' : '') + '<div class="app-top">' + (back ? '<button type="button" class="icon-btn" data-act="sGo" data-screen="' + (scr === 'request' || scr === 'newRequest' ? 'requests' : scr === 'notifs' ? 'home' : 'tickets') + '" aria-label="Back"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>' : '') +
    '<h2 class="grow" style="font-size:20px">' + esc(titles[scr] || '') + '</h2><button type="button" class="icon-btn" data-act="sGo" data-screen="notifs" aria-label="Notifications, ' + unread + ' unread">' + icon('bell', 18) + (unread ? '<span class="dot">' + unread + '</span>' : '') + '</button></div>';
  const fn = { home: sHome, stay: sStay, requests: sRequests, request: sRequest, newRequest: sNewRequest, tickets: sTickets, ticket: sTicket, report: sReport, notifs: sNotifs, profile: sProfile }[scr] || sHome;
  const tab = (id, ic, text) => '<button type="button" data-act="sGo" data-screen="' + id + '"' + ((scr === id || (id === 'requests' && ['request', 'newRequest'].includes(scr)) || (id === 'tickets' && ['ticket', 'report'].includes(scr))) ? ' aria-current="page"' : '') + '>' + icon(ic, 20) + text + '</button>';
  return top + '<div class="app-body">' + fn(me) + '</div><nav class="tabbar" aria-label="App">' + tab('home', 'home', 'Home') + tab('stay', 'bed', 'My stay') + tab('requests', 'check', 'Requests') + tab('tickets', 'wrench', 'Issues') + tab('profile', 'user', 'Profile') + '</nav>';
}

function stayCard(me) {
  const a = currentAlloc(S, me.id);
  if (!a) return '<div class="stay-card"><span class="sub">Your accommodation</span><span class="big">No bed yet</span><span class="sub">Reception will let you know when a bed is allocated.</span></div>';
  const room = roomOfBed(S, a.bedId);
  return '<div class="stay-card"><span class="sub">' + (a.status === 'confirmed' ? 'Your bed from ' + fmtDate(a.start) : 'You are staying in') + '</span><span class="big">' + esc(room.no + ' \u00b7 Bed ' + byId(S.beds, a.bedId).label) + '</span><span class="sub">' + esc(bedWhere(S, a.bedId)) + '</span><span class="sub">' + (a.end ? 'Until ' + fmtDate(a.end) : 'No end date') + '</span></div>';
}

function sHome(me) {
  const toConfirm = S.tickets.filter((t) => t.requesterStaffId === me.id && t.status === 'resolved');
  const changes = S.requests.filter((r) => r.staffId === me.id && r.status === 'changes_requested');
  const next = S.allocations.find((a) => a.staffId === me.id && a.status === 'confirmed' && a.transferFrom);
  const actions = toConfirm.map((t) => '<button type="button" class="list-btn" style="background:var(--warn-bg)" data-act="sGo" data-screen="ticket" data-param="' + t.id + '"><span class="grow"><b>Was this fixed?</b><div class="small">' + esc(t.title) + ' \u00b7 ' + esc(t.no) + '</div></span></button>').join('') +
    changes.map((r) => '<button type="button" class="list-btn" style="background:var(--warn-bg)" data-act="sGo" data-screen="request" data-param="' + r.id + '"><span class="grow"><b>Changes requested</b><div class="small">' + esc(REQUEST_TYPES[r.type].name) + ' \u00b7 ' + esc(r.no) + '</div></span></button>').join('') +
    (next ? '<div class="alert info">Room change: move to <b>' + esc(bedLabel(S, next.bedId)) + '</b> on ' + fmtDate(next.start) + '.</div>' : '');
  const qa = [['report', 'wrench', 'Report an issue'], ['room_change', 'swap', 'Room change'], ['visitor_stay', 'guest', 'Visitor stay'], ['family_accommodation', 'users', 'Family stay'], ['exit_clearance', 'door', 'Exit clearance'], ['stay', 'bed', 'My stay']];
  return stayCard(me) + (actions ? '<div class="stack tight"><h3>Needs your attention</h3>' + actions + '</div>' : '') +
    '<div class="stack tight"><h3>Quick actions</h3><div class="qa">' + qa.map(([k, ic, t]) => '<button type="button" data-act="' + (k === 'report' || k === 'stay' ? 'sGo' : 'sNewReq') + '" data-screen="' + k + '" data-type="' + k + '">' + icon(ic, 22) + esc(t) + '</button>').join('') + '</div></div>';
}

function sStay(me) {
  const a = currentAlloc(S, me.id);
  if (!a) return stayCard(me) + '<p class="small muted">Nothing to show yet.</p>';
  const room = roomOfBed(S, a.bedId);
  const site = byId(S.sites, room.siteId);
  const mates = S.beds.filter((b) => b.roomId === room.id && b.id !== a.bedId && bedState(S, b.id).state === 'occupied').length;
  return stayCard(me) + '<div class="card"><dl class="kv"><dt>Site</dt><dd>' + esc(site.name) + '</dd><dt>Building</dt><dd>' + esc(byId(S.buildings, room.buildingId).name) + '</dd><dt>Room type</dt><dd>' + esc(typeName(room.typeId)) + '</dd><dt>Roommates</dt><dd>' + mates + '</dd><dt>From</dt><dd>' + fmtDate(a.start) + '</dd><dt>Until</dt><dd>' + fmtDate(a.end) + '</dd><dt>Keys you hold</dt><dd>' + (keysHeldBy(S, me.id).map((k) => k.code).join(', ') || 'None') + '</dd></dl></div>' +
    '<div class="card"><h3>Reception</h3><p class="small">' + esc(site.help) + '</p><p class="mono">' + esc(site.phone) + '</p><p class="small muted">' + esc(site.email) + '</p></div>' +
    '<button type="button" class="btn" data-act="sNewReq" data-type="room_change">Ask for a room change</button>';
}

function sRequests(me) {
  const list = S.requests.filter((r) => r.staffId === me.id);
  return '<button type="button" class="btn primary" data-act="sNewReq" data-type="room_change">' + icon('plus', 16) + 'New request</button>' +
    (list.length ? list.map((r) => '<button type="button" class="list-btn card" style="padding:12px" data-act="sGo" data-screen="request" data-param="' + r.id + '"><span class="grow stack tight"><b>' + esc(REQUEST_TYPES[r.type].name) + '</b><span class="small muted">' + esc(r.no) + ' \u00b7 ' + fmtStamp(r.submitted) + '</span>' + reqPill(r) + '</span></button>').join('') : '<div class="empty">You have no requests yet.</div>');
}

function sRequest(me) {
  const r = byId(S.requests, S.session.staffParam);
  if (!r) return '<div class="empty">Request not found.</div>';
  const t = REQUEST_TYPES[r.type];
  const visibleSteps = r.steps.filter((s) => s.decision !== 'cancel');
  let tail = '';
  if (r.status === 'changes_requested') {
    tail = '<form class="card" data-form="s_resubmit" novalidate><h3>Update and resubmit</h3>' + staffErr() + '<div class="form-grid">' + requestFields(r.type, r.data) + '</div><button type="submit" class="btn primary">Resubmit</button></form>';
  }
  if (['pending_approval', 'changes_requested'].includes(r.status)) tail += '<button type="button" class="btn danger" data-act="sWithdraw" data-id="' + r.id + '">Withdraw request</button>';
  return '<div class="card"><div class="row between"><b>' + esc(t.name) + '</b>' + reqPill(r) + '</div><span class="small muted">' + esc(r.no) + ' \u00b7 sent ' + fmtStamp(r.submitted) + '</span>' +
    '<dl class="kv">' + t.fields.map((fd) => '<dt>' + esc(fd.label) + '</dt><dd style="white-space:pre-line">' + esc(fd.type === 'date' ? fmtDate(r.data[fd.key] || null) : fd.type === 'building' ? (r.data[fd.key] ? byId(S.buildings, r.data[fd.key]).name : 'No preference') : (r.data[fd.key] || '\u2014')) + '</dd>').join('') + '</dl></div>' +
    '<div class="card"><h3>Progress</h3><ol class="timeline">' + r.stages.map((name, i) => {
      const dec = r.steps.filter((s) => s.stage === i && ['approve', 'reject', 'changes'].includes(s.decision)).slice(-1)[0];
      const cls = dec ? (dec.decision === 'approve' ? '' : 'bad') : i === r.stage && r.status === 'pending_approval' ? 'now' : 'todo';
      return '<li><span class="rail"><i class="' + cls + '"></i>' + (i < r.stages.length - 1 ? '<b></b>' : '') + '</span><span class="body"><b>' + esc(name) + '</b><span class="small muted">' + (dec ? ({ approve: 'Approved', reject: 'Rejected', changes: 'Asked for changes' }[dec.decision]) + ' \u00b7 ' + fmtStamp(dec.at) : i === r.stage && r.status === 'pending_approval' ? 'Waiting for a decision' : 'Not started') + '</span>' + (dec && dec.comment ? '<span class="small">\u201c' + esc(dec.comment) + '\u201d</span>' : '') + '</span></li>';
    }).join('') + '</ol>' + (r.fulfilment ? '<div class="alert ok">' + esc(r.fulfilment.text) + '</div>' : '') + (visibleSteps.length ? '' : '') + '</div>' + tail;
}

function sNewRequest(me) {
  const type = val('type', S.session.staffParam || 'room_change');
  const t = REQUEST_TYPES[type];
  return '<form class="stack" data-form="s_request" novalidate>' + staffErr() +
    fSelect('type', 'What do you need?', Object.keys(REQUEST_TYPES).map((k) => [k, REQUEST_TYPES[k].name]), { value: type, act: 'formChange' }) +
    '<div class="form-grid">' + requestFields(type, type === 'room_change' ? { moveDate: '' } : {}) + '</div>' +
    '<p class="small muted">Goes to: ' + esc(S.workflows[type].stages.map((s) => s.name).join(', then ')) + '. You will get a notification at each step.</p>' +
    '<button type="submit" class="btn primary">Send ' + esc(t.name.toLowerCase()) + ' request</button></form>';
}

function sTickets(me) {
  const list = S.tickets.filter((t) => t.requesterStaffId === me.id);
  return '<button type="button" class="btn primary" data-act="sGo" data-screen="report">' + icon('plus', 16) + 'Report an issue</button>' +
    (list.length ? list.map((t) => '<button type="button" class="list-btn card" style="padding:12px" data-act="sGo" data-screen="ticket" data-param="' + t.id + '"><span class="grow stack tight"><b>' + esc(t.title) + '</b><span class="small muted">' + esc(t.no) + ' \u00b7 ' + esc(byId(S.rooms, t.roomId).no) + '</span><span>' + pill(TICKET_TONE[t.status], t.status === 'resolved' ? 'Fixed? Please confirm' : TICKET_LABEL[t.status]) + '</span></span></button>').join('') : '<div class="empty">No issues reported.</div>');
}

function sTicket(me) {
  const t = byId(S.tickets, S.session.staffParam);
  if (!t) return '<div class="empty">Issue not found.</div>';
  const ups = t.updates.filter((u) => u.type !== 'note' || u.visible);
  return '<div class="card"><div class="row between"><b>' + esc(t.title) + '</b>' + pill(TICKET_TONE[t.status], TICKET_LABEL[t.status]) + '</div><span class="small muted">' + esc(t.no) + ' \u00b7 ' + esc(byId(S.rooms, t.roomId).no) + ' \u00b7 ' + esc(t.category) + '</span>' +
    (t.resolution ? '<div class="alert ok"><b>What we did:</b> ' + esc(t.resolution) + '</div>' : '') + '</div>' +
    (t.status === 'resolved' ? '<form class="card" data-form="s_feedback" novalidate><h3>Is it fixed?</h3>' + staffErr() +
      '<div class="checks" role="radiogroup">' + [['confirm', 'Yes, it is fixed'], ['reopen', 'No, it still needs work']].map(([v, l]) => '<label class="check"><input type="radio" name="action" value="' + v + '"' + (val('action', 'confirm') === v ? ' checked' : '') + '><span>' + l + '</span></label>').join('') + '</div>' +
      fSelect('rating', 'How was the service?', [['5', '5 \u00b7 Excellent'], ['4', '4 \u00b7 Good'], ['3', '3 \u00b7 OK'], ['2', '2 \u00b7 Poor'], ['1', '1 \u00b7 Very poor']], { value: '5' }) +
      fText('comment', 'Comment', { rows: 2, help: 'Required if it still needs work.' }) + '<button type="submit" class="btn primary">Send</button></form>' : '') +
    '<div class="card"><h3>Updates</h3><ol class="timeline">' + ups.slice().reverse().map((u, i, arr) => '<li><span class="rail"><i></i>' + (i < arr.length - 1 ? '<b></b>' : '') + '</span><span class="body"><b>' + esc(u.text) + '</b><span class="small muted">' + fmtStamp(u.at) + '</span></span></li>').join('') + '</ol></div>';
}

function sReport(me) {
  const a = currentAlloc(S, me.id);
  const roomId = a ? roomOfBed(S, a.bedId).id : '';
  return '<form class="stack" data-form="s_report" novalidate>' + staffErr() +
    fSelect('roomId', 'Where is the problem?', roomOpts(), { value: roomId, required: true, placeholder: 'Choose' }) + fInput('location', 'Exact spot', { placeholder: 'e.g. bathroom ceiling' }) +
    fSelect('category', 'What kind of problem?', S.categories, { required: true, value: '', placeholder: 'Choose' }) +
    fInput('title', 'Short title', { required: true, placeholder: 'e.g. Tap is leaking' }) + fText('description', 'Tell us more', { required: true, rows: 3 }) +
    fSelect('urgency', 'How urgent?', [['emergency', 'Emergency \u00b7 danger or flooding'], ['high', 'High \u00b7 today'], ['normal', 'Normal \u00b7 this week'], ['low', 'Low \u00b7 when possible']], { value: 'normal' }) +
    fSelect('contact', 'How should we contact you?', CONTACT, { value: 'in_app' }) + fSelect('access', 'Can we enter your room?', ACCESS, { value: 'call_first' }) +
    fFile('photoName', 'Add a photo') + '<button type="submit" class="btn primary">Send report</button></form>';
}

function sNotifs(me) {
  const list = S.notifications.filter((n) => n.to === me.id);
  return (list.length ? '<button type="button" class="btn sm" data-act="sReadAll">Mark all read</button>' + list.map((n) => '<div class="card" style="padding:12px;gap:4px' + (n.read ? '' : ';background:var(--surface-3)') + '"><b>' + esc(n.title) + '</b><span class="small">' + esc(n.body) + '</span><span class="small muted">' + fmtStamp(n.at) + '</span></div>').join('') : '<div class="empty">No notifications.</div>');
}

function sProfile(me) {
  return '<form class="stack" data-form="s_profile" novalidate>' + staffErr() +
    '<div class="card"><div class="row"><span class="avatar lg">' + initials(me.first + ' ' + me.last) + '</span>' + who(me.first + ' ' + me.last, me.empId + ' \u00b7 ' + me.dept) + '</div>' +
    '<dl class="kv"><dt>Company</dt><dd>' + esc(me.company) + '</dd><dt>Line manager</dt><dd>' + esc(me.managerId ? staffName(S, me.managerId) : '\u2014') + '</dd></dl><span class="small muted">Contact HR to change employment details.</span></div>' +
    fInput('phone', 'Mobile', { type: 'tel', value: me.phone }) + fInput('email', 'Email', { type: 'email', value: me.email }) +
    '<fieldset class="fieldset"><legend>Emergency contact</legend>' + fInput('emName', 'Name', { value: me.emergency.name }) + fInput('emRelation', 'Relationship', { value: me.emergency.relation }) + fInput('emPhone', 'Phone', { type: 'tel', value: me.emergency.phone }) + '</fieldset>' +
    '<button type="submit" class="btn primary">Save</button><button type="button" class="btn" data-act="staffSignOut">Sign out</button></form>';
}

/* ---------- staff form handlers ---------- */
FORMS.s_login = (f) => { S.session.staffAs = f.staffId; S.session.staffScreen = 'home'; S.session.sf = null; };
FORMS.s_request = (f) => { const r = opSubmitRequest(S, f.type, S.session.staffAs, pickData(f), false); S.session.staffScreen = 'request'; S.session.staffParam = r.id; S.session.sf = null; toast('Sent. ' + r.stages[0] + ' will review it.'); };
FORMS.s_resubmit = (f) => { opResubmit(S, S.session.staffParam, pickData(f)); S.session.sf = null; toast('Resubmitted.'); };
FORMS.s_report = (f) => { const t = opCreateTicket(S, f, S.session.staffAs, 'staff'); S.session.staffScreen = 'ticket'; S.session.staffParam = t.id; S.session.sf = null; toast('Thanks. Your report is ' + t.no + '.'); };
FORMS.s_feedback = (f) => { opTicketFeedback(S, S.session.staffParam, f); S.session.sf = null; toast(f.action === 'reopen' ? 'Reopened. The maintenance team was told.' : 'Thanks for confirming.'); };
FORMS.s_profile = (f) => { opSaveMyProfile(S, S.session.staffAs, f); S.session.sf = null; toast('Profile saved.'); };

</script>
<script>
/* Staff Accommodation prototype: actions and event wiring. */

FORMS.login = (f) => {
  if (!String(f.email || '').trim()) fail('Enter your work email.');
  if (!String(f.password || '').trim()) fail('Enter your password.');
  if (!/^\d{6}$/.test(String(f.mfa || '').trim())) fail('Enter the 6-digit code from your authenticator app.');
  S.session.signedIn = true;
  S.journey.signin = true;
  S.ui.view = 'dashboard';
  toast('Signed in. The journey guide at the bottom right walks you through everything.');
};
FORMS.settings = (f) => { opSaveSettings(S, f); toast('Policy saved. It applies to new allocations from now on.'); };

/* ---------- navigation and generic actions ---------- */
A.nav = (d) => nav(d.view);
A.tab = (d) => { S.ui.tab[d.group] = d.id; if (d.group === 'admin' && d.id === 'audit') S.journey.audit = true; commit(); };
A.adminTab = (d) => nav('admin', d.id);
A.siteFilter = (d) => { S.ui.siteFilter = d.id; commit(); };
A.accSite = (d) => { S.ui.siteFilter = d.id; accUi().page = 1; commit(); };
A.accView = (d) => { accUi().view = d.v; commit(); };
A.accOpen = (d) => { S.ui.buildingSel = d.id; S.ui.bedSel = null; accUi().view = 'map'; commit(); };
A.accExpand = () => { accUi().expand = !accUi().expand; commit(); };
A.accPage = (d) => { accUi().page = Math.max(1, Number(d.p)); commit(); };
A.accSet = (d, el) => { const u = accUi(); u[d.key] = d.key === 'per' ? Number(el.value) : el.value; if (d.key !== 'page') u.page = 1; commit(); };
A.pickBuilding = (d) => { S.ui.buildingSel = d.id; S.ui.bedSel = null; commit(); };
A.pickBed = (d) => { S.ui.bedSel = S.ui.bedSel === d.id ? null : d.id; commit(); };
A.openModal = (d) => { const p = Object.assign({}, d); delete p.act; const kind = p.kind; delete p.kind; openModal(kind, p); };
A.closeModal = () => closeModal();
A.toggleNotif = () => { S.ui.notifOpen = !S.ui.notifOpen; commit(); };
A.readAll = () => { myNotifs().forEach((n) => { n.read = true; }); commit(); };
A.openNotif = (d) => {
  const n = byId(S.notifications, d.id);
  n.read = true;
  S.ui.notifOpen = false;
  if (n.link && VIEWS[n.link]) nav(n.link); else commit();
};
A.guide = (d) => { S.ui.guideOpen = d.open === '1'; commit(); };
A.toast = (d) => { toast(d.msg); render(); };
A.logout = () => { S.session.signedIn = false; S.ui.modal = null; commit(); };
A.doReset = () => {
  S = seed();
  S.session.signedIn = true;
  S.journey.signin = true;
  toast('Prototype reset to the sample data.');
  commit();
};
A.toStaffMode = () => { S.session.mode = 'staff'; S.ui.modal = null; S.ui.notifOpen = false; S.session.sf = null; commit(); window.scrollTo(0, 0); };
A.toAdminMode = () => { S.session.mode = 'admin'; S.session.sf = null; commit(); window.scrollTo(0, 0); };
A.releaseBlock = (d) => { opReleaseBlocks(S, d.id); toast('Block released. The bed can be allocated again.'); commit(); };
A.keyRestore = (d) => {
  const k = byId(S.keys, d.id);
  const before = k.status;
  k.status = 'available'; k.condition = 'good'; k.holder = null;
  S.keyTx.unshift({ id: uid('kt'), keyId: k.id, code: k.code, type: 'restore', who: '', at: nowIso(), by: S.me.name, notes: 'Back in service' });
  audit(S, 'Key back in service', k.code, before + ' \u2192 available');
  toast(k.code + ' is available again.');
  commit();
};
A.userStatus = (d) => {
  try { opSetUserStatus(S, d.id, d.status); S.ui.modal = null; toast(d.status === 'deactivated' ? 'User deactivated and signed out everywhere.' : 'User reactivated.'); }
  catch (e) { if (S.ui.modal) S.ui.modal.error = e.message; else toast(e.message); }
  commit();
};
A.flipSetting = (d, el) => {
  const on = el.getAttribute('aria-checked') !== 'true';
  el.setAttribute('aria-checked', String(on));
  const hidden = el.parentElement.querySelector('input[type=hidden][name="' + d.name + '"]');
  if (hidden) hidden.value = on ? '1' : '';
};
A.retryMsg = () => { S.ui.tab.retried = true; audit(S, 'Message retried', 'Email to maria.s@[client-domain]', 'Delivered on retry'); toast('Retried and delivered.'); commit(); };
A.copyExport = () => {
  const text = S.ui.modal && S.ui.modal.csv ? S.ui.modal.csv : '';
  const fallback = () => { const t = document.getElementById('export-csv'); if (t) { t.focus(); t.select(); } toast('Selected. Press Ctrl+C or Cmd+C to copy.'); render(); };
  try {
    navigator.clipboard.writeText(text).then(() => { toast('CSV copied.'); render(); }).catch(fallback);
  } catch (e) { fallback(); }
};
A.wizBack = () => { const m = S.ui.modal; m.step = Math.max(1, m.step - 1); m.values = m.data; m.error = null; commit(); };
A.formChange = (d, el) => {
  const form = el.closest('form');
  if (!form) return;
  const obj = readForm(form);
  form.querySelectorAll('input[type=checkbox]').forEach((c) => {
    if (Object.prototype.hasOwnProperty.call(obj, c.name)) return;
    obj[c.name] = c.name === 'bedIds' || c.name === 'returnKeys' ? [] : '';
  });
  if (el.name === 'typeId') delete obj.capacity;
  if (el.name === 'roomId' && form.dataset.form === 'block') delete obj.bedIds;
  if (el.name === 'siteId' && S.ui.modal && S.ui.modal.kind === 'allocate') obj.buildingId = '';
  if (S.ui.modal) {
    const m = S.ui.modal;
    m.values = Object.assign({}, m.data || m.values || {}, m.values || {}, obj);
    if (m.data) Object.assign(m.data, obj);
    m.error = null; m.warnings = null;
  } else if (S.session.mode === 'staff') {
    S.session.sf = { values: Object.assign({}, (S.session.sf && S.session.sf.values) || {}, obj), error: null };
  }
  commit();
};

/* ---------- journey shortcuts ---------- */
const needAdmin = () => { S.session.mode = 'admin'; if (!S.session.signedIn) { S.session.signedIn = true; S.journey.signin = true; } };
A.goRoom = () => { needAdmin(); S.ui.view = 'accommodation'; openModal('room', { building: S.ui.buildingSel }); };
A.goStaff = () => { needAdmin(); S.ui.view = 'staff'; openModal('staff', {}); };
A.goAllocate = () => {
  needAdmin();
  S.ui.view = 'allocations';
  const target = S.journey.newStaff || 'st16';
  openModal('allocate', { staffId: currentAlloc(S, target) ? '' : target });
};
A.goCheckin = () => {
  needAdmin();
  const a = S.allocations.slice().reverse().find((x) => x.status === 'confirmed' && x.start <= TODAY);
  S.ui.view = 'allocations';
  if (a) openModal('checkIn', { id: a.id });
  else { S.ui.tab.allocations = 'confirmed'; toast('Allocate a bed starting today first, then check the person in.'); commit(); }
};
A.goStaffApp = () => {
  S.session.mode = 'staff';
  S.session.staffAs = S.journey.allocStaff || 'st16';
  S.session.staffScreen = 'report';
  S.session.sf = null;
  S.ui.modal = null;
  commit();
};
A.goTickets = () => {
  needAdmin();
  S.ui.view = 'maintenance';
  const t = S.tickets.find((x) => x.requesterStaffId && x.updates[0] && /resident app/.test(x.updates[0].text) && !['resolved', 'closed', 'cancelled'].includes(x.status)) || S.tickets.find((x) => !['resolved', 'closed', 'cancelled'].includes(x.status));
  if (t) openModal('ticket', { id: t.id }); else commit();
};
A.goStaffTickets = () => {
  const t = S.tickets.find((x) => x.status === 'resolved' && x.requesterStaffId);
  S.session.mode = 'staff';
  if (t) { S.session.staffAs = t.requesterStaffId; S.session.staffScreen = 'ticket'; S.session.staffParam = t.id; }
  else { S.session.staffAs = S.session.staffAs || S.journey.allocStaff || 'st16'; S.session.staffScreen = 'tickets'; }
  S.session.sf = null;
  S.ui.modal = null;
  commit();
};
A.goStaffRequest = () => {
  S.session.mode = 'staff';
  S.session.staffAs = S.session.staffAs || S.journey.allocStaff || 'st16';
  S.session.staffScreen = 'newRequest';
  S.session.staffParam = 'visitor_stay';
  S.session.sf = null;
  S.ui.modal = null;
  commit();
};
A.goApprove = () => {
  needAdmin();
  S.ui.view = 'requests';
  const r = S.requests.find((x) => x.type === 'room_change' && x.status === 'pending_approval');
  if (r) openModal('request', { id: r.id }); else commit();
};
A.goCheckout = () => {
  needAdmin();
  S.ui.view = 'allocations';
  const a = S.allocations.find((x) => x.staffId === 'st3' && x.status === 'checked_in') || S.allocations.find((x) => x.status === 'checked_in');
  if (a) openModal('checkOut', { id: a.id }); else commit();
};
A.goAudit = () => { needAdmin(); nav('admin', 'audit'); };

/* ---------- resident app actions ---------- */
A.sGo = (d) => sGo(d.screen, d.param);
A.sNewReq = (d) => sGo('newRequest', d.type);
A.sWithdraw = (d) => {
  try { opCancelRequest(S, d.id); toast('Request withdrawn.'); } catch (e) { toast(e.message); }
  commit();
};
A.sReadAll = () => { S.notifications.forEach((n) => { if (n.to === S.session.staffAs) n.read = true; }); commit(); };
A.staffSignOut = () => { S.session.staffAs = null; S.session.staffScreen = 'home'; S.session.sf = null; commit(); };

/* ---------- wiring ---------- */
document.addEventListener('click', (e) => {
  const bd = e.target.closest('[data-backdrop]');
  if (bd && e.target === bd) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (S.ui.notifOpen && !e.target.closest('.notif-panel')) { S.ui.notifOpen = false; commit(); }
    return;
  }
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(Object.assign({}, el.dataset), el);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.change && A[el.dataset.change]) { A[el.dataset.change](Object.assign({}, el.dataset), el); return; }
  if (el.dataset && el.dataset.filter) { S.ui.tab[el.dataset.filter] = el.value; commit(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.q != null) { S.ui.q[el.dataset.q] = el.value; render(); }
});
document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const f = readForm(form);
  try {
    if (!FORMS[kind]) throw new Error('This form is not wired up yet.');
    const res = FORMS[kind](f);
    if (kind === 'allocate' && res !== 'stay' && !S.ui.modal) {
      const last = S.allocations[S.allocations.length - 1];
      if (last) S.journey.allocStaff = last.staffId;
    }
    if (kind === 'staff' && S.staff.length) S.journey.newStaff = S.staff[S.staff.length - 1].id;
    commit();
  } catch (err) {
    let ctx = S.ui.modal;
    if (!ctx && S.session.mode === 'staff') { S.session.sf = S.session.sf || {}; ctx = S.session.sf; }
    if (ctx) {
      ctx.error = err.message;
      ctx.warnings = err.warnings || null;
      ctx.values = Object.assign({}, ctx.data || {}, ctx.values || {}, f);
      ctx.scrollToError = true;
      commit();
      const target = document.querySelector('.backdrop') || document.querySelector('.app-body');
      if (target) target.scrollTop = 0;
    } else {
      toast(err.message);
      render();
    }
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (S.ui.modal) { closeModal(); return; }
  if (S.ui.notifOpen) { S.ui.notifOpen = false; commit(); }
});

render();

</script>
</body>
</html>
