<script>
/* Staff Accommodation prototype: operations. In the real build each of these is a Cloud Function
   that runs in one Firestore transaction. Here they validate, mutate state and throw
   an Error with a user-facing message when a rule is broken. */

function fail(msg) { throw new Error(msg); }
function req(v, name) { if (v == null || String(v).trim() === '') fail(name + ' is required.'); return String(v).trim(); }

/* ---------- setup ---------- */
function opAddSite(S, f) {
  const code = req(f.code, 'Site code').toUpperCase();
  if (S.sites.some((s) => s.code === code)) fail('Site code ' + code + ' is already used. Codes must be unique.');
  const site = { id: uid('s'), name: req(f.name, 'Site name'), code, timezone: req(f.timezone, 'Timezone'), address: f.address || '', phone: f.phone || '', email: f.email || '', help: f.help || '', status: f.status || 'active' };
  S.sites.push(site);
  audit(S, 'Site created', site.name, 'Timezone ' + site.timezone);
  return site;
}
function opAddBuilding(S, f) {
  const b = { id: uid('b'), siteId: req(f.siteId, 'Site'), name: req(f.name, 'Building name'), type: f.type || 'staff_block', floors: Number(f.floors) || 1, gender: f.gender || 'mixed', status: f.status || 'active' };
  if (S.buildings.some((x) => x.siteId === b.siteId && x.name.toLowerCase() === b.name.toLowerCase())) fail('A building called ' + b.name + ' already exists at this site.');
  S.buildings.push(b);
  audit(S, 'Building created', b.name, label(BUILDING_TYPES, b.type) + ', ' + label(GENDER_POLICIES, b.gender));
  return b;
}
function opSaveRoom(S, f, roomId) {
  const bld = byId(S.buildings, req(f.buildingId, 'Building'));
  const no = req(f.no, 'Room number');
  const capacity = Number(f.capacity);
  if (!(capacity >= 1 && capacity <= 12)) fail('Capacity must be between 1 and 12 beds.');
  if (S.rooms.some((r) => r.buildingId === bld.id && r.no.toLowerCase() === no.toLowerCase() && r.id !== roomId)) fail('Room ' + no + ' already exists in ' + bld.name + '.');
  if (f.status === 'blocked' && !String(f.statusReason || '').trim()) fail('Give a reason when a room is blocked.');
  const amenities = AMENITIES.map((a) => a[0]).filter((k) => f['am_' + k]);
  if (!roomId) {
    const room = { id: uid('r'), buildingId: bld.id, siteId: bld.siteId, no, floor: f.floor || '', typeId: f.typeId, capacity, gender: f.gender || bld.gender, mode: f.mode || 'bed', amenities, eligibility: f.eligibility || '', status: f.status || 'active', statusReason: f.statusReason || '' };
    S.rooms.push(room);
    for (let i = 0; i < capacity; i++) S.beds.push({ id: uid('bd'), roomId: room.id, label: 'ABCDEFGHIJKL'[i], status: 'active', blocks: [] });
    for (let c = 1; c <= capacity + 1; c++) S.keys.push({ id: uid('k'), code: 'K-' + no + '-' + c, label: no + ' room door', kind: 'room', roomId: room.id, copy: c, status: 'available', condition: 'good', holder: null, custodian: 'Leila Farouk', storage: 'Cabinet ' + no[0] + ', hook ' + c });
    S.journey.room = true;
    audit(S, 'Room created', no, capacity + ' beds created automatically, ' + (capacity + 1) + ' keys registered');
    return room;
  }
  const room = byId(S.rooms, roomId);
  const beds = S.beds.filter((b) => b.roomId === roomId && b.status !== 'retired');
  if (capacity < beds.length) {
    const removable = beds.slice().reverse().filter((b) => bedState(S, b.id).state === 'vacant' && !S.allocations.some((a) => a.bedId === b.id && OCCUPYING.includes(a.status)));
    const need = beds.length - capacity;
    if (removable.length < need) fail('Only ' + removable.length + ' bed(s) in ' + room.no + ' are free with no bookings, so capacity can drop to ' + (beds.length - removable.length) + ' at most.');
    removable.slice(0, need).forEach((b) => { b.status = 'retired'; });
  } else if (capacity > beds.length) {
    const used = S.beds.filter((b) => b.roomId === roomId).map((b) => b.label);
    const free = 'ABCDEFGHIJKL'.split('').filter((l) => !used.includes(l));
    for (let i = 0; i < capacity - beds.length; i++) S.beds.push({ id: uid('bd'), roomId, label: free[i], status: 'active', blocks: [] });
  }
  const before = room.status;
  Object.assign(room, { no, floor: f.floor || '', typeId: f.typeId, capacity, gender: f.gender, mode: f.mode, amenities, eligibility: f.eligibility || '', status: f.status, statusReason: f.statusReason || '' });
  audit(S, 'Room updated', no, before !== room.status ? 'Status ' + before + ' \u2192 ' + room.status : 'Capacity ' + capacity);
  return room;
}
function opBlockBeds(S, f) {
  const bedIds = f.bedIds;
  if (!bedIds || !bedIds.length) fail('Pick at least one bed to block.');
  const start = req(f.start, 'Start date');
  const end = f.end || null;
  if (end && end <= start) fail('The block must end after it starts.');
  const clash = [];
  bedIds.forEach((id) => {
    S.allocations.forEach((a) => {
      if (a.bedId === id && OCCUPYING.includes(a.status) && overlaps(start, end, a.start, a.end)) clash.push(bedLabel(S, id) + ' has ' + staffName(S, a.staffId) + ' (' + ALLOC_LABEL[a.status].toLowerCase() + ')');
    });
  });
  if (clash.length) fail('These beds have stays in that period: ' + clash.join('; ') + '. Move or end those stays first.');
  bedIds.forEach((id) => byId(S.beds, id).blocks.push({ id: uid('blk'), start, end, reason: f.reason, note: f.note || '', ticketNo: f.ticketNo || '', status: 'active' }));
  audit(S, 'Beds blocked', bedIds.map((id) => bedLabel(S, id)).join(', '), label(BLOCK_REASONS, f.reason) + ' from ' + fmtDate(start) + ' to ' + fmtDate(end));
}
function opReleaseBlocks(S, bedId) {
  const b = byId(S.beds, bedId);
  b.blocks.forEach((k) => { if (k.status === 'active') k.status = 'released'; });
  audit(S, 'Block released', bedLabel(S, bedId), 'Bed available again');
}

/* ---------- staff ---------- */
function opSaveStaff(S, f, staffId) {
  const empId = req(f.empId, 'Employee ID').toUpperCase();
  if (S.staff.some((s) => s.empId === empId && s.id !== staffId)) fail('Employee ID ' + empId + ' already belongs to ' + staffName(S, S.staff.find((s) => s.empId === empId).id) + '. Employee IDs must be unique.');
  if (f.email && !/^[^@\s]+@[^@\s]+$/.test(f.email)) fail('Enter a valid email address, like name@company.com.');
  const data = {
    empId, first: req(f.first, 'First name'), last: req(f.last, 'Last name'), gender: req(f.gender, 'Gender'), nationality: f.nationality || '',
    email: f.email || '', phone: f.phone || '', dept: req(f.dept, 'Department'), company: f.company || '', grade: f.grade || '', managerId: f.managerId || '',
    employment: f.employment || 'active', empEnd: f.empEnd || '', joinDate: f.joinDate || '',
    emergency: { name: f.emName || '', relation: f.emRelation || '', phone: f.emPhone || '' }
  };
  if (data.employment !== 'active' && data.employment !== 'on_leave' && !data.empEnd) fail('Add the employment end date for staff on notice or terminated.');
  if (staffId) {
    const s = byId(S.staff, staffId);
    const wasActive = s.employment;
    Object.assign(s, data);
    audit(S, 'Staff updated', s.first + ' ' + s.last, wasActive !== s.employment ? 'Employment ' + wasActive + ' \u2192 ' + s.employment : 'Profile fields');
    return s;
  }
  const s = Object.assign({ id: uid('st'), status: 'active' }, data);
  S.staff.push(s);
  if (f.createLogin) S.users.push({ id: uid('u'), name: s.first + ' ' + s.last, email: s.email, phone: s.phone, roles: ['staff'], scope: 'own', staffId: s.id, status: 'invited', last: 'Never' });
  S.journey.staff = true;
  audit(S, 'Staff created', s.first + ' ' + s.last + ' (' + s.empId + ')', f.createLogin ? 'Resident app invitation sent' : '');
  return s;
}

/* ---------- allocations ---------- */
function opAllocate(S, o) {
  const st = byId(S.staff, o.staffId);
  if (!st) fail('Pick a staff member.');
  if (!o.bedId) fail('Pick a bed.');
  const start = req(o.start, 'Start date');
  const end = o.end || null;
  if (!end && !S.settings.openEnded) fail('Open-ended stays are switched off. Add an end date.');
  if (end && end <= start) fail('The end date must be after the start date.');
  if (start < TODAY && o.kind !== 'correction') fail('The start date cannot be in the past. Use a correction for past stays.');
  if (st.employment === 'terminated') fail(st.first + '\u2019s employment has ended, so they cannot get a new bed.');
  const c = bedConflicts(S, o.bedId, start, end, o.ignore);
  if (c.length) fail('This bed is no longer available: ' + c.map((x) => x.text).join('; ') + '. Nothing was saved. Pick another bed.');
  if ((o.kind || 'staff') === 'staff' && !o.allowStaffOverlap) {
    const sc = staffConflicts(S, o.staffId, start, end, o.ignore);
    if (sc.length) fail(st.first + ' already has ' + bedLabel(S, sc[0].bedId) + ' for these dates (' + sc[0].no + '). Use a transfer instead.');
  }
  const warn = policyWarnings(S, o.staffId, o.bedId, o.kind || 'staff');
  if (warn.length && !String(o.overrideReason || '').trim()) { const e = new Error(warn.join(' ')); e.warnings = warn; throw e; }
  const a = mkAlloc(S, { staffId: o.staffId, bedId: o.bedId, start, end, status: o.status || 'confirmed', reason: o.reason, kind: o.kind || 'staff', guest: o.guest, note: o.note, requestId: o.requestId, transferFrom: o.transferFrom, at: nowIso(), by: S.me.name });
  if (warn.length) a.overrides.push({ rule: warn.join(' '), by: S.me.name, reason: o.overrideReason, at: nowIso() });
  S.allocations.push(a);
  S.journey.allocate = true;
  audit(S, 'Allocation created', a.no, staffName(S, a.staffId) + ' \u2192 ' + bedLabel(S, a.bedId) + ' from ' + fmtDate(start) + (warn.length ? ' (policy override: ' + o.overrideReason + ')' : ''));
  notify(S, a.staffId, 'Your accommodation is confirmed', bedLabel(S, a.bedId) + ', ' + bedWhere(S, a.bedId) + ', from ' + fmtDate(start) + '.', 'stay');
  return a;
}
function opCheckIn(S, allocId, f) {
  const a = byId(S.allocations, allocId);
  if (a.status !== 'confirmed') fail('Only confirmed allocations can be checked in.');
  if (a.start > TODAY) fail('This stay starts on ' + fmtDate(a.start) + '. Check-in opens on that day.');
  const missing = CHECKIN_ITEMS.filter(([k]) => !f[k]);
  if (missing.length && !String(f.notes || '').trim()) fail('Tick every checklist item, or explain what was skipped in the condition notes.');
  let keyTxt = 'No key issued';
  if (f.keyId) {
    const k = byId(S.keys, f.keyId);
    if (k.status !== 'available') fail(k.code + ' is not available. Pick another key.');
    opIssueKey(S, k.id, { staffId: a.staffId, due: a.end || '', condition: 'good', allocationId: a.id }, true);
    keyTxt = 'Key ' + k.code + ' issued';
  }
  a.status = 'checked_in';
  a.checkIn = { at: nowIso(), by: S.me.name, checks: CHECKIN_ITEMS.filter(([k]) => f[k]).map(([, l]) => l), notes: f.notes || '', photo: f.photoName || '', key: keyTxt };
  a.history.push({ at: nowIso(), by: S.me.name, text: 'Checked in. ' + keyTxt + '.' });
  S.journey.checkin = true;
  audit(S, 'Checked in', a.no, staffName(S, a.staffId) + ' \u00b7 ' + bedLabel(S, a.bedId) + ' \u00b7 ' + keyTxt);
  notify(S, a.staffId, 'Welcome to ' + bedLabel(S, a.bedId), 'You are checked in. Reception: ' + byId(S.sites, roomOfBed(S, a.bedId).siteId).phone + '.', 'stay');
}
function checkoutBlockers(S, a) {
  const b = [];
  keysHeldBy(S, a.staffId).forEach((k) => b.push({ kind: 'key', id: k.id, text: 'Key ' + k.code + ' (' + k.label + ') not returned' }));
  S.tickets.filter((t) => t.requesterStaffId === a.staffId && t.roomId === roomOfBed(S, a.bedId).id && !['closed', 'cancelled', 'resolved'].includes(t.status)).forEach((t) => b.push({ kind: 'ticket', id: t.id, text: 'Open ticket ' + t.no + ': ' + t.title }));
  return b;
}
function opCheckOut(S, allocId, f) {
  const a = byId(S.allocations, allocId);
  if (a.status !== 'checked_in') fail('Only checked-in stays can be checked out.');
  (f.returnKeys || []).forEach((id) => opReturnKey(S, id, { condition: f['cond_' + id] || 'good', notes: 'Returned at check-out' }, true));
  const left = checkoutBlockers(S, a);
  if (left.length && !f.override) fail('Resolve these first, or tick "Check out anyway": ' + left.map((x) => x.text).join('; ') + '.');
  if (left.length && !String(f.overrideReason || '').trim()) fail('Explain why you are checking out with items outstanding.');
  const missing = CHECKOUT_ITEMS.filter(([k]) => !f[k]);
  if (missing.length && !String(f.notes || '').trim()) fail('Tick every checklist item, or describe the room condition in the notes.');
  a.status = 'checked_out';
  if (!a.end || a.end > TODAY) a.end = TODAY;
  a.checkOut = { at: nowIso(), by: S.me.name, checks: CHECKOUT_ITEMS.filter(([k]) => f[k]).map(([, l]) => l), notes: f.notes || '', override: left.length ? f.overrideReason : '' };
  if (left.length) a.overrides.push({ rule: left.map((x) => x.text).join('; '), by: S.me.name, reason: f.overrideReason, at: nowIso() });
  a.history.push({ at: nowIso(), by: S.me.name, text: 'Checked out' + (left.length ? ' with exception: ' + f.overrideReason : '') + '.' });
  S.journey.checkout = true;
  audit(S, 'Checked out', a.no, staffName(S, a.staffId) + ' left ' + bedLabel(S, a.bedId) + (left.length ? ' \u00b7 exception: ' + f.overrideReason : ''));
  notify(S, a.staffId, 'You have checked out', 'Thank you. Your stay at ' + bedLabel(S, a.bedId) + ' is closed.', 'stay');
}
function opTransfer(S, allocId, destBedId, eff, reason, requestId) {
  const a = byId(S.allocations, allocId);
  if (!['confirmed', 'checked_in'].includes(a.status)) fail('Only confirmed or checked-in stays can be transferred.');
  if (!destBedId) fail('Pick the destination bed.');
  if (destBedId === a.bedId) fail('Pick a different bed from the current one.');
  if (!eff) fail('Effective date is required.');
  if (eff < TODAY) fail('The effective date cannot be in the past.');
  if (eff <= a.start) fail('The effective date must be after the current stay started (' + fmtDate(a.start) + ').');
  if (a.end && eff >= a.end) fail('The current stay already ends on ' + fmtDate(a.end) + '.');
  const c = bedConflicts(S, destBedId, eff, a.end, []);
  if (c.length) fail('The destination bed is not available: ' + c.map((x) => x.text).join('; ') + '. Nothing was saved. Pick another bed.');
  const warn = policyWarnings(S, a.staffId, destBedId, 'staff');
  if (warn.length) fail(warn.join(' ') + ' Pick a bed that fits the room policy.');
  const sameDay = eff === TODAY && a.status === 'checked_in';
  const n = mkAlloc(S, { staffId: a.staffId, bedId: destBedId, start: eff, end: a.end, status: sameDay ? 'checked_in' : 'confirmed', reason: 'transfer', transferFrom: a.id, requestId, at: nowIso(), by: S.me.name, note: reason || '' });
  S.allocations.push(n);
  a.transferTo = n.id;
  a.end = eff;
  if (sameDay) {
    a.status = 'checked_out';
    a.checkOut = { at: nowIso(), by: S.me.name, checks: [], notes: 'Moved to ' + bedLabel(S, destBedId), override: '' };
    n.checkIn = { at: nowIso(), by: S.me.name, checks: [], notes: 'Moved from ' + bedLabel(S, a.bedId), photo: '', key: '' };
    const oldRoom = roomOfBed(S, a.bedId).id;
    keysHeldBy(S, a.staffId).filter((k) => k.roomId === oldRoom).forEach((k) => opReturnKey(S, k.id, { condition: 'good', notes: 'Returned on room change' }, true));
    const nk = S.keys.find((k) => k.roomId === roomOfBed(S, destBedId).id && k.status === 'available');
    if (nk) { opIssueKey(S, nk.id, { staffId: a.staffId, due: '', condition: 'good', allocationId: n.id }, true); n.checkIn.key = 'Key ' + nk.code + ' issued'; }
  }
  a.history.push({ at: nowIso(), by: S.me.name, text: 'Transfer to ' + bedLabel(S, destBedId) + ' effective ' + fmtDate(eff) + '.' });
  S.journey.transfer = true;
  audit(S, 'Transfer', a.no + ' \u2192 ' + n.no, staffName(S, a.staffId) + ': ' + bedLabel(S, a.bedId) + ' \u2192 ' + bedLabel(S, destBedId) + ', effective ' + fmtDate(eff));
  notify(S, a.staffId, 'Your room change is confirmed', 'Move to ' + bedLabel(S, destBedId) + ' on ' + fmtDate(eff) + '.' + (sameDay ? ' Your new key is ready at reception.' : ''), 'stay');
  return n;
}
function opCancelAlloc(S, allocId, reason) {
  const a = byId(S.allocations, allocId);
  if (!['confirmed', 'pending_approval', 'draft'].includes(a.status)) fail('Only stays that have not started can be cancelled. Use check-out instead.');
  req(reason, 'Cancellation reason');
  a.status = 'cancelled';
  a.cancelReason = reason;
  if (a.transferFrom) {
    const prev = byId(S.allocations, a.transferFrom);
    if (prev && prev.status === 'checked_in') { prev.end = a.end; prev.transferTo = null; prev.history.push({ at: nowIso(), by: S.me.name, text: 'Transfer cancelled, stay continues.' }); }
  }
  a.history.push({ at: nowIso(), by: S.me.name, text: 'Cancelled: ' + reason });
  audit(S, 'Allocation cancelled', a.no, reason);
  notify(S, a.staffId, 'An allocation was cancelled', bedLabel(S, a.bedId) + ' from ' + fmtDate(a.start) + '. Reason: ' + reason, 'stay');
}
function opChangeEnd(S, allocId, newEnd, reason) {
  const a = byId(S.allocations, allocId);
  const end = newEnd || null;
  if (end && end <= a.start) fail('The end date must be after ' + fmtDate(a.start) + '.');
  if (end && end < TODAY && a.status === 'checked_in') fail('A current stay cannot end in the past. Check the person out instead.');
  const c = bedConflicts(S, a.bedId, a.start, end, [a.id]);
  if (c.length) fail('The bed is booked after this stay: ' + c.map((x) => x.text).join('; ') + '.');
  req(reason, 'Reason');
  const before = a.end;
  a.end = end;
  a.history.push({ at: nowIso(), by: S.me.name, text: 'End date ' + fmtDate(before) + ' \u2192 ' + fmtDate(end) + ': ' + reason });
  audit(S, 'End date changed', a.no, fmtDate(before) + ' \u2192 ' + fmtDate(end));
}

/* ---------- requests and approvals ---------- */
function opSubmitRequest(S, type, staffId, data, onBehalf) {
  const t = REQUEST_TYPES[type];
  if (!t) fail('Pick a request type.');
  t.fields.forEach((fd) => { if (fd.required) req(data[fd.key], fd.label); });
  if (type === 'visitor_stay' && data.departure <= data.arrival) fail('Departure must be after arrival.');
  if (type === 'family_accommodation' && data.end && data.end <= data.start) fail('End date must be after the start date.');
  if (type === 'exit_clearance' && data.departure < TODAY) fail('The leaving date cannot be in the past.');
  if (type === 'room_change' && !currentAlloc(S, staffId)) fail(staffName(S, staffId) + ' has no current bed to change.');
  const dup = S.requests.find((r) => r.staffId === staffId && r.type === type && ['pending_approval', 'changes_requested', 'resubmitted'].includes(r.status));
  if (dup) fail('There is already an open ' + t.name.toLowerCase() + ' request (' + dup.no + ').');
  const r = mkReq(S, type, staffId, data, 0, [], null, nowIso());
  r.onBehalf = !!onBehalf;
  S.requests.unshift(r);
  if (S.session.mode === 'staff') S.journey.staffRequest = true;
  audit(S, 'Request submitted', r.no, t.name + (onBehalf ? ' on behalf of ' + staffName(S, staffId) : ''));
  notify(S, 'admin', t.name + ' submitted', staffName(S, staffId) + ' \u00b7 ' + r.no + ' \u00b7 stage 1 of ' + r.stages.length + '.', 'requests');
  if (onBehalf) notify(S, staffId, 'A request was raised for you', t.name + ' \u00b7 ' + r.no + '.', 'requests');
  return r;
}
function opResubmit(S, reqId, data) {
  const r = byId(S.requests, reqId);
  if (r.status !== 'changes_requested') fail('Only requests returned for changes can be resubmitted.');
  REQUEST_TYPES[r.type].fields.forEach((fd) => { if (fd.required) req(data[fd.key], fd.label); });
  r.revisions.push({ data: r.data, at: nowIso() });
  r.data = data;
  r.status = 'pending_approval';
  r.steps.push({ stage: r.stage, by: staffName(S, r.staffId), decision: 'resubmit', comment: 'Resubmitted with changes', at: nowIso() });
  audit(S, 'Request resubmitted', r.no, 'Revision ' + (r.revisions.length + 1));
  notify(S, 'admin', 'Request resubmitted', r.no + ' \u00b7 ' + staffName(S, r.staffId), 'requests');
}
function opCancelRequest(S, reqId) {
  const r = byId(S.requests, reqId);
  if (!['pending_approval', 'changes_requested'].includes(r.status)) fail('This request can no longer be cancelled.');
  r.status = 'cancelled';
  r.steps.push({ stage: r.stage, by: staffName(S, r.staffId), decision: 'cancel', comment: 'Withdrawn by requester', at: nowIso() });
  audit(S, 'Request withdrawn', r.no, '');
}
function opDecide(S, reqId, f) {
  const r = byId(S.requests, reqId);
  if (r.status !== 'pending_approval') fail('This request is not waiting for a decision.');
  const me = byId(S.users, S.me.userId);
  if (me && me.staffId && me.staffId === r.staffId && !S.workflows[r.type].selfApproval) fail('You cannot approve your own request.');
  const d = f.decision;
  if ((d === 'reject' || d === 'changes') && !String(f.comment || '').trim()) fail('Add a reason for the requester before you ' + (d === 'reject' ? 'reject.' : 'ask for changes.'));
  const last = r.stage >= r.stages.length - 1;
  const t = REQUEST_TYPES[r.type];
  if (d === 'approve' && last && !r.fulfilment) {
    // run the operational action first; if it fails nothing is recorded (WF-08, idempotent)
    if (r.type === 'room_change') {
      const cur = currentAlloc(S, r.staffId);
      if (!cur) fail(staffName(S, r.staffId) + ' no longer has a bed to move from.');
      const n = opTransfer(S, cur.id, f.bedId, f.effDate || r.data.moveDate, 'Room change ' + r.no, r.id);
      r.fulfilment = { text: 'Transfer ' + n.no + ' to ' + bedLabel(S, n.bedId) + ' effective ' + fmtDate(n.start), at: nowIso() };
      S.journey.approve = true;
    } else if (r.type === 'visitor_stay') {
      const n = opAllocate(S, { staffId: r.staffId, bedId: f.bedId, start: r.data.arrival, end: r.data.departure, kind: 'visitor', reason: 'visitor', guest: { name: r.data.visitorName, relation: r.data.relation, phone: r.data.visitorPhone }, requestId: r.id });
      r.fulfilment = { text: 'Visitor bed ' + bedLabel(S, n.bedId) + ' reserved (' + n.no + ')', at: nowIso() };
    } else if (r.type === 'family_accommodation') {
      const n = opAllocate(S, { staffId: r.staffId, bedId: f.bedId, start: r.data.start, end: r.data.end || null, kind: 'family', reason: 'family', guest: { name: r.data.members.split('\n')[0], relation: 'Family', phone: '' }, requestId: r.id, overrideReason: f.overrideReason });
      r.fulfilment = { text: 'Family allocation ' + n.no + ' at ' + bedLabel(S, n.bedId), at: nowIso() };
    } else if (r.type === 'exit_clearance') {
      const cur = currentAlloc(S, r.staffId);
      if (cur) { cur.end = r.data.departure; cur.history.push({ at: nowIso(), by: S.me.name, text: 'End date set to ' + fmtDate(r.data.departure) + ' by exit clearance ' + r.no }); }
      r.fulfilment = { text: 'Check-out scheduled for ' + fmtDate(r.data.departure) + '. Keys to return: ' + keysHeldBy(S, r.staffId).length, at: nowIso() };
    }
  }
  r.steps.push({ stage: r.stage, by: S.me.name, decision: d, comment: f.comment || '', at: nowIso() });
  if (d === 'approve') {
    if (last) { r.status = 'fulfilled'; }
    else r.stage += 1;
  } else if (d === 'reject') r.status = 'rejected';
  else if (d === 'changes') r.status = 'changes_requested';
  const outcome = d === 'approve' ? (last ? 'approved' : 'approved at stage ' + (r.stage) + ', now with ' + r.stages[r.stage]) : d === 'reject' ? 'rejected' : 'returned for changes';
  audit(S, 'Request ' + (d === 'approve' ? 'approved' : d === 'reject' ? 'rejected' : 'returned'), r.no, r.stages[Math.min(r.stage, r.stages.length - 1)] + (f.comment ? ' \u00b7 "' + f.comment + '"' : ''));
  notify(S, r.staffId, t.name + ' ' + (d === 'approve' && !last ? 'moved to the next approver' : outcome), (r.fulfilment && d === 'approve' && last ? r.fulfilment.text + '.' : '') + (f.comment ? ' Comment: ' + f.comment : ''), 'requests');
}

/* ---------- maintenance ---------- */
function opCreateTicket(S, f, staffId, source) {
  const roomId = req(f.roomId, 'Location');
  const room = byId(S.rooms, roomId);
  const t = {
    id: uid('t'), no: nextNo(S, 'MNT'), title: req(f.title, 'Short title'), roomId, siteId: room.siteId, location: f.location || '', category: req(f.category, 'Category'),
    description: req(f.description, 'Description'), urgency: req(f.urgency, 'Urgency'), priority: '', contact: f.contact || 'in_app', access: f.access || 'call_first',
    photo: f.photoName || '', requesterStaffId: staffId || null, status: 'new', team: '', blockRoom: false, created: nowIso(), resolution: '', feedback: null,
    updates: [{ at: nowIso(), by: staffId ? staffName(S, staffId) : S.me.name, text: 'Reported from the ' + (source === 'staff' ? 'resident app' : 'management portal') + (f.photoName ? ' with photo ' + f.photoName : '') + '.', type: 'created' }]
  };
  S.tickets.unshift(t);
  if (source === 'staff') S.journey.ticket = true;
  audit(S, 'Ticket created', t.no, t.title + ' \u00b7 ' + room.no + ' \u00b7 ' + label(URGENCY, t.urgency));
  notify(S, 'admin', (t.urgency === 'emergency' ? 'Emergency ticket ' : 'New ticket ') + t.no, t.title + ' in ' + room.no + '.', 'maintenance');
  if (staffId) notify(S, staffId, 'We received your report', t.no + ' \u00b7 ' + t.title + '. You will be updated as it progresses.', 'tickets');
  return t;
}
function opTicketUpdate(S, id, f) {
  const t = byId(S.tickets, id);
  const before = t.status;
  const to = f.status || t.status;
  if (to === 'resolved' && !String(f.resolution || '').trim()) fail('A resolution note is required to resolve a ticket.');
  if ((to === 'assigned' || to === 'in_progress') && !(f.team || t.team)) fail('Assign the ticket to a team or contractor first.');
  if (to === 'cancelled' && !String(f.note || '').trim()) fail('Say why the ticket is cancelled.');
  if (f.urgency) t.urgency = f.urgency;
  if (f.priority) t.priority = f.priority;
  if (f.team && f.team !== t.team) { t.team = f.team; t.updates.push({ at: nowIso(), by: S.me.name, text: 'Assigned to ' + f.team + '.', type: 'assign' }); }
  if (f.blockRoom && !t.blockRoom) {
    const beds = S.beds.filter((b) => b.roomId === t.roomId && b.status === 'active');
    const occupied = beds.filter((b) => bedState(S, b.id).state === 'occupied');
    if (occupied.length) fail(byId(S.rooms, t.roomId).no + ' has residents, so it cannot be blocked. Untick "Block the room".');
    beds.forEach((b) => b.blocks.push({ id: uid('blk'), start: TODAY, end: null, reason: 'repair', note: t.title, ticketNo: t.no, status: 'active' }));
    t.blockRoom = true;
    t.updates.push({ at: nowIso(), by: S.me.name, text: 'Room blocked until the repair is done.', type: 'block' });
  }
  if (to === 'resolved') {
    t.resolution = f.resolution;
    if (t.blockRoom) { S.beds.filter((b) => b.roomId === t.roomId).forEach((b) => b.blocks.forEach((k) => { if (k.ticketNo === t.no) k.status = 'released'; })); t.blockRoom = false; }
  }
  t.status = to;
  if (f.note) t.updates.push({ at: nowIso(), by: S.me.name, text: f.note, type: 'note', visible: !!f.visible });
  if (before !== to) {
    t.updates.push({ at: nowIso(), by: S.me.name, text: 'Status ' + TICKET_LABEL[before] + ' \u2192 ' + TICKET_LABEL[to] + (to === 'resolved' ? ': ' + f.resolution : '') + '.', type: 'status' });
    if (t.requesterStaffId && ['assigned', 'in_progress', 'waiting_parts', 'resolved', 'cancelled'].includes(to)) notify(S, t.requesterStaffId, t.no + ' is ' + TICKET_LABEL[to].toLowerCase(), t.title + (to === 'resolved' ? '. Please confirm the fix in the app.' : '.'), 'tickets');
  }
  if (to === 'resolved') S.journey.resolve = true;
  audit(S, 'Ticket updated', t.no, before !== to ? TICKET_LABEL[before] + ' \u2192 ' + TICKET_LABEL[to] : 'Note or assignment');
}
function opTicketFeedback(S, id, f) {
  const t = byId(S.tickets, id);
  if (t.status !== 'resolved') fail('Only resolved tickets can be confirmed or reopened.');
  if (f.action === 'reopen') {
    req(f.comment, 'What is still wrong');
    t.status = 'reopened';
    t.updates.push({ at: nowIso(), by: staffName(S, t.requesterStaffId), text: 'Reopened: ' + f.comment, type: 'status' });
    notify(S, 'admin', t.no + ' was reopened', f.comment, 'maintenance');
    audit(S, 'Ticket reopened', t.no, f.comment);
  } else {
    t.status = 'closed';
    t.feedback = { rating: Number(f.rating) || 5, comment: f.comment || '' };
    t.updates.push({ at: nowIso(), by: staffName(S, t.requesterStaffId), text: 'Confirmed fixed \u00b7 rated ' + t.feedback.rating + '/5' + (f.comment ? ': ' + f.comment : ''), type: 'status' });
    S.journey.confirm = true;
    audit(S, 'Ticket closed by resident', t.no, 'Rating ' + t.feedback.rating + '/5');
  }
}

/* ---------- keys ---------- */
function opRegisterKey(S, f) {
  const code = req(f.code, 'Key code').toUpperCase();
  if (S.keys.some((k) => k.code === code)) fail('Key code ' + code + ' is already registered.');
  const k = { id: uid('k'), code, label: req(f.label, 'Label'), kind: f.kind, roomId: f.roomId || null, copy: Number(f.copy) || 1, status: 'available', condition: f.condition || 'good', holder: null, custodian: f.custodian || S.me.name, storage: f.storage || '' };
  S.keys.push(k);
  audit(S, 'Key registered', code, k.label);
}
function opIssueKey(S, keyId, f, silent) {
  const k = byId(S.keys, keyId);
  if (k.status !== 'available') fail(k.code + ' is already ' + KEY_LABEL[k.status].toLowerCase() + (k.holder ? ' to ' + k.holder.name : '') + '. Record its return first, or pick another copy.');
  const name = f.staffId ? staffName(S, f.staffId) : req(f.holderName, 'Recipient');
  k.status = 'issued';
  k.condition = f.condition || k.condition;
  k.holder = { staffId: f.staffId || null, name, since: TODAY, due: f.due || null };
  S.keyTx.unshift({ id: uid('kt'), keyId, code: k.code, type: 'issue', who: name, at: nowIso(), by: S.me.name, notes: f.notes || '' });
  S.journey.key = true;
  if (!silent) audit(S, 'Key issued', k.code, 'To ' + name + (f.due ? ', return by ' + fmtDate(f.due) : ''));
  else audit(S, 'Key issued', k.code, 'To ' + name);
}
function opReturnKey(S, keyId, f, silent) {
  const k = byId(S.keys, keyId);
  if (k.status !== 'issued') fail(k.code + ' is not issued.');
  const who = k.holder ? k.holder.name : '';
  k.status = f.condition === 'damaged' ? 'damaged' : 'available';
  k.condition = f.condition || 'good';
  k.holder = null;
  S.keyTx.unshift({ id: uid('kt'), keyId, code: k.code, type: 'return', who, at: nowIso(), by: S.me.name, notes: f.notes || '' });
  audit(S, 'Key returned', k.code, 'From ' + who + ', condition ' + k.condition + (silent ? '' : ''));
}
function opKeyIncident(S, keyId, f) {
  const k = byId(S.keys, keyId);
  req(f.notes, 'What happened');
  const who = k.holder ? k.holder.name : '';
  k.status = f.type;
  if (f.type === 'lost' || f.type === 'retired') k.holder = null;
  S.keyTx.unshift({ id: uid('kt'), keyId, code: k.code, type: f.type, who, at: nowIso(), by: S.me.name, notes: f.notes });
  audit(S, 'Key ' + KEY_LABEL[f.type].toLowerCase(), k.code, f.notes);
  if (f.type === 'lost') notify(S, 'admin', 'Key reported lost', k.code + ' \u00b7 ' + f.notes, 'keys');
}

/* ---------- users and settings ---------- */
function opSaveUser(S, f, userId) {
  const email = req(f.email, 'Email').toLowerCase();
  if (!/^[^@\s]+@[^@\s]+$/.test(email)) fail('Enter a valid email address.');
  if (S.users.some((u) => u.email.toLowerCase() === email && u.id !== userId)) fail('A user with ' + email + ' already exists.');
  const roles = ROLES.map((r) => r[0]).filter((k) => f['role_' + k]);
  if (!roles.length) fail('Give the user at least one role.');
  if (roles.includes('staff') && !f.staffId) fail('Link a staff profile for the Staff / resident role.');
  if (userId) {
    const u = byId(S.users, userId);
    const before = u.roles.join(', ');
    Object.assign(u, { name: req(f.name, 'Name'), email, phone: f.phone || '', roles, scope: f.scope, staffId: f.staffId || null });
    audit(S, 'Roles changed', u.name, before + ' \u2192 ' + roles.join(', '));
    return;
  }
  const u = { id: uid('u'), name: req(f.name, 'Name'), email, phone: f.phone || '', roles, scope: f.scope, staffId: f.staffId || null, status: 'invited', last: 'Never' };
  S.users.push(u);
  audit(S, 'User invited', u.name, roles.join(', ') + ' \u00b7 scope ' + (u.scope === 'all' ? 'all sites' : (byId(S.sites, u.scope) || {}).name));
}
function opSetUserStatus(S, userId, status) {
  const u = byId(S.users, userId);
  if (u.id === S.me.userId) fail('You cannot deactivate your own account.');
  const before = u.status;
  u.status = status;
  audit(S, status === 'deactivated' ? 'User deactivated' : 'User reactivated', u.name, before + ' \u2192 ' + status + (status === 'deactivated' ? '. Sessions ended, history kept.' : ''));
}
function opSaveWorkflow(S, type, f) {
  const names = String(f.stages || '').split('\n').map((x) => x.trim()).filter(Boolean);
  if (!names.length) fail('Add at least one approval stage.');
  const w = S.workflows[type];
  w.stages = names.map((n) => ({ name: n, rule: 'role' }));
  w.selfApproval = !!f.selfApproval;
  w.version += 1;
  audit(S, 'Approval route changed', REQUEST_TYPES[type].name, 'Version ' + w.version + ': ' + names.join(' \u2192 ') + '. Open requests keep their original route.');
}
function opSaveSettings(S, f) {
  const before = JSON.stringify(S.settings);
  S.settings.selfBooking = !!f.selfBooking;
  S.settings.openEnded = !!f.openEnded;
  S.settings.genderEnforce = !!f.genderEnforce;
  S.settings.holdHours = Number(f.holdHours) || 0;
  S.settings.transferOverlap = Number(f.transferOverlap) || 0;
  S.settings.reopenDays = Number(f.reopenDays) || 7;
  if (before !== JSON.stringify(S.settings)) audit(S, 'Policy changed', 'Allocation policy', 'Hold ' + S.settings.holdHours + 'h, open-ended ' + (S.settings.openEnded ? 'on' : 'off') + ', gender rule ' + (S.settings.genderEnforce ? 'on' : 'off'));
}
function opSaveMyProfile(S, staffId, f) {
  const s = byId(S.staff, staffId);
  if (f.email && !/^[^@\s]+@[^@\s]+$/.test(f.email)) fail('Enter a valid email address.');
  s.phone = f.phone || '';
  s.email = f.email || '';
  s.emergency = { name: f.emName || '', relation: f.emRelation || '', phone: f.emPhone || '' };
  audit(S, 'Profile updated by resident', s.first + ' ' + s.last, 'Contact and emergency details');
}

/* ---------- motion ----------
   The whole app re-renders on every change, so entrance animations are switched on only for the
   part that actually changed (screen, pop-up, wizard step, toast, panel); everything else stays still. */
const SEEN = { mode: null, view: null, modal: null, step: null, toast: null, notif: false, guide: null, done: null };
function animateEntrances(app) {
  const m = S.ui.modal;
  const mode = S.session.mode + (S.session.signedIn ? '1' : '0');
  const view = mode + '|' + S.ui.view + '|' + (S.ui.tab[S.ui.view] || '') + '|' + (S.session.staffAs || '') + '|' + S.session.staffScreen + '|' + (S.session.staffParam || '');
  const modal = m ? m.kind + '|' + (m.id || '') : null;
  const step = m ? modal + '|' + (m.step || '') : null;
  const flags = {
    'enter-mode': SEEN.mode !== mode,
    'enter-view': SEEN.view !== view,
    'enter-modal': !!modal && SEEN.modal !== modal,
    'enter-step': !!step && SEEN.modal === modal && SEEN.step !== step,
    'enter-toast': !!TOAST && SEEN.toast !== TOAST,
    'enter-notif': !!S.ui.notifOpen && !SEEN.notif,
    'enter-guide': !!S.ui.guideOpen && SEEN.guide === false
  };
  Object.keys(flags).forEach((c) => app.classList.toggle(c, flags[c]));
  const done = GUIDE.filter(([k]) => S.journey[k]).map(([k]) => k);
  if (SEEN.done) done.filter((k) => !SEEN.done.includes(k)).forEach((k) => { const li = app.querySelector('.guide li[data-k="' + k + '"]'); if (li) li.classList.add('just-done'); });
  Object.assign(SEEN, { mode, view, modal, step, toast: TOAST, notif: !!S.ui.notifOpen, guide: !!S.ui.guideOpen, done });
  if (flags['enter-view']) {
    ['.kpis > *', '.rooms > *', '.lane > .ticket', '.tbl tbody > tr', '.app-body > *'].forEach((sel) => {
      const groups = new Map();
      app.querySelectorAll(sel).forEach((el) => { const p = el.parentElement; const n = groups.get(p) || 0; el.style.setProperty('--i', Math.min(n, 14)); groups.set(p, n + 1); });
    });
    countUp(app);
  }
  if (flags['enter-modal'] || flags['enter-step']) app.querySelectorAll('.modal-body > *').forEach((el, i) => el.style.setProperty('--i', Math.min(i, 10)));
}
function countUp(app) {
  let reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduce = false; }
  if (reduce) return;
  app.querySelectorAll('.kpi .v').forEach((el) => {
    const m = /^(\D*)(\d+(?:\.\d+)?)(.*)$/.exec(el.textContent.trim());
    if (!m) return;
    const target = parseFloat(m[2]); const dec = (m[2].split('.')[1] || '').length; const t0 = performance.now(); const dur = 900;
    const tick = (t) => {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - p, 3);
      el.textContent = m[1] + (target * e).toFixed(dec) + m[3];
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

  const app = document.getElementById('app');
  const active = document.activeElement;
  const aid = active && active.id;
  let selStart = null;
  try { selStart = active && 'selectionStart' in active ? active.selectionStart : null; } catch (e) { selStart = null; }
  const bd = document.querySelector('.backdrop');
  const bdScroll = bd ? bd.scrollTop : 0;
  let html;
  if (S.session.mode === 'staff') html = viewStaffMode();
  else if (!S.session.signedIn) html = viewLogin();
  else html = viewAdmin();
  app.innerHTML = html + renderModal() + renderNotifPanel() + renderGuide() + (TOAST ? '<div class="toast" role="status">' + esc(TOAST) + '</div>' : '');
  animateEntrances(app);
  const nbd = document.querySelector('.backdrop');
  if (nbd) nbd.scrollTop = bdScroll;
  if (focusFirst && nbd) {
    focusFirst = false;
    const first = nbd.querySelector('input:not([type=hidden]):not([readonly]), select, textarea, button.btn');
    if (first) first.focus();
  } else if (aid) {
    const el = document.getElementById(aid);
    if (el) { el.focus(); if (selStart != null) { try { el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text field */ } } }

  const err = nbd && nbd.querySelector('.alert.error, .alert.warn');
  if (err && S.ui.modal && S.ui.modal.error && S.ui.modal.scrollToError) { S.ui.modal.scrollToError = false; nbd.scrollTop = 0; }
}

    '<div class="legend"><span><i style="background:var(--bed-occ)"></i>Occupied</span><span><i style="background:var(--info-bg);border:1px solid var(--info-fg)"></i>Reserved</span><span><i style="border:1.5px dashed var(--accent)"></i>Vacant</span><span><i style="background:var(--danger-bg);border:1px solid var(--danger-fg)"></i>Blocked</span></div></div>' +
    (rooms.length ? '<div class="rooms">' + roomCards + '</div>' : '<div class="empty">No rooms in this building yet. <button type="button" class="link" data-act="openModal" data-kind="room" data-building="' + bSel.id + '">Add the first room</button></div>') +
    '</section></div>' + bedPanel() + '</div>';

  };
}
function bedPanel() {
  const b = byId(S.beds, S.ui.bedSel);
  if (!b) return '<aside class="card" style="flex:1 1 260px"><h2>Select a bed</h2><p class="muted">Click any bed on the map to see who is in it and what you can do.</p></aside>';
  const r = byId(S.rooms, b.roomId);
  const st = bedState(S, b.id);
  const a = st.alloc;
  const hist = S.allocations.filter((x) => x.bedId === b.id).sort((x, y) => (x.start < y.start ? 1 : -1));
  const block = b.blocks.find((k) => k.status === 'active');
  let actions = '';
  if (st.state === 'vacant') actions = '<button type="button" class="btn primary" data-act="openModal" data-kind="allocate" data-bed="' + b.id + '">Allocate this bed</button><button type="button" class="btn" data-act="openModal" data-kind="block" data-bed="' + b.id + '">Block</button>';
  if (st.state === 'reserved') actions = (a.start <= TODAY ? '<button type="button" class="btn primary" data-act="openModal" data-kind="checkIn" data-id="' + a.id + '">Check in</button>' : '') + '<button type="button" class="btn" data-act="openModal" data-kind="allocation" data-id="' + a.id + '">Open allocation</button>';
  if (st.state === 'occupied') actions = '<button type="button" class="btn primary" data-act="openModal" data-kind="transfer" data-id="' + a.id + '">Transfer</button><button type="button" class="btn" data-act="openModal" data-kind="checkOut" data-id="' + a.id + '">Check out</button><button type="button" class="btn ghost" data-act="openModal" data-kind="allocation" data-id="' + a.id + '">Details</button>';
  if (st.state === 'blocked' && block) actions = '<button type="button" class="btn" data-act="releaseBlock" data-id="' + b.id + '">Release block</button>';
  const tone = { occupied: 'ok', reserved: 'info', vacant: 'neutral', blocked: 'danger' }[st.state];
  return '<aside class="card" style="flex:1 1 260px" aria-label="Selected bed"><div class="row between"><h2>' + esc(r.no + ' \u00b7 Bed ' + b.label) + '</h2>' + pill(tone, st.state[0].toUpperCase() + st.state.slice(1)) + '</div>' +
    '<span class="small muted">' + esc(bedWhere(S, b.id)) + ' \u00b7 ' + esc(typeName(r.typeId)) + '</span>' +
    (a ? '<div class="row"><span class="avatar dark">' + initials(staffName(S, a.staffId)) + '</span>' + who(staffName(S, a.staffId) + (a.guest ? ' (guest: ' + a.guest.name + ')' : ''), (byId(S.staff, a.staffId) || {}).empId + ' \u00b7 ' + a.no) + '</div><dl class="kv"><dt>From</dt><dd>' + fmtDate(a.start) + '</dd><dt>Until</dt><dd>' + fmtDate(a.end) + '</dd><dt>Keys held</dt><dd>' + (keysHeldBy(S, a.staffId).map((k) => k.code).join(', ') || 'None') + '</dd></dl>' : '') +
    (st.state === 'blocked' && block ? '<dl class="kv"><dt>Reason</dt><dd>' + esc(label(BLOCK_REASONS, block.reason)) + (block.note ? ': ' + esc(block.note) : '') + '</dd><dt>Ticket</dt><dd>' + esc(block.ticketNo || '\u2014') + '</dd><dt>Until</dt><dd>' + fmtDate(block.end) + '</dd></dl>' : '') +
    (st.state === 'vacant' ? '<p class="small">Free today' + (S.allocations.some((x) => x.bedId === b.id && x.status === 'confirmed') ? ', with a future booking.' : ' with no future bookings.') + ' Policy: ' + esc(label(GENDER_POLICIES, r.gender)) + '.</p>' : '') +
    '<div class="row">' + actions + '</div>' +
    '<div class="stack tight"><h3>Bed history</h3>' + (hist.length ? hist.slice(0, 5).map((x) => '<button type="button" class="list-btn" data-act="openModal" data-kind="allocation" data-id="' + x.id + '" style="padding:8px"><span class="grow small"><b>' + esc(staffName(S, x.staffId)) + '</b> \u00b7 ' + fmtDate(x.start) + ' \u2013 ' + fmtDate(x.end) + '</span>' + allocPill(x) + '</button>').join('') : '<span class="small muted">No stays recorded yet.</span>') + '</div></aside>';
}

/* ---------- allocations ---------- */
VIEWS.allocations = function () {
  const tab = S.ui.tab.allocations || 'all';
  const groups = {
    all: () => true,
    pending: (a) => a.status === 'pending_approval',
    confirmed: (a) => a.status === 'confirmed',
    in: (a) => a.status === 'checked_in',
    closed: (a) => ['checked_out', 'cancelled', 'rejected', 'expired'].includes(a.status)
  };
  const names = [['all', 'All'], ['confirmed', 'Confirmed'], ['in', 'Checked in'], ['pending', 'Pending approval'], ['closed', 'Closed']];
  const list = S.allocations.filter(groups[tab]).filter((a) => { const st = byId(S.staff, a.staffId) || {}; return matches('alloc', a.no, staffName(S, a.staffId), st.empId, bedLabel(S, a.bedId), a.guest ? a.guest.name : ''); })
    .sort((x, y) => (x.start < y.start ? 1 : -1));
  const action = (a) => {
    if (a.status === 'confirmed') return (a.start <= TODAY ? '<button type="button" class="btn sm primary" data-act="openModal" data-kind="checkIn" data-id="' + a.id + '">Check in</button> ' : '') + '<button type="button" class="btn sm" data-act="openModal" data-kind="cancelAlloc" data-id="' + a.id + '">Cancel</button>';
    if (a.status === 'checked_in') return '<button type="button" class="btn sm" data-act="openModal" data-kind="transfer" data-id="' + a.id + '">Transfer</button> <button type="button" class="btn sm" data-act="openModal" data-kind="checkOut" data-id="' + a.id + '">Check out</button>';
    return '';
  };
  const body =
    '<section class="card">' + tabs('allocations', names.map(([id, n]) => [id, n, S.allocations.filter(groups[id]).length]), tab) +
    '<div class="form-grid">' + searchBox('alloc', 'Name, employee ID, room, allocation number') + '</div>' +
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>Allocation</th><th>Staff or guest</th><th>Bed</th><th>Start</th><th>End</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>' +
    (list.length ? list.map((a) => '<tr class="clickable" data-act="openModal" data-kind="allocation" data-id="' + a.id + '"><td class="mono">' + esc(a.no) + '</td><td>' + who(a.guest ? a.guest.name + ' (' + a.kind + ')' : staffName(S, a.staffId), a.guest ? 'Host: ' + staffName(S, a.staffId) : (byId(S.staff, a.staffId) || {}).empId) + '</td><td>' + esc(bedLabel(S, a.bedId)) + '<div class="small muted">' + esc(bedWhere(S, a.bedId)) + '</div></td><td>' + fmtDate(a.start) + '</td><td>' + fmtDate(a.end) + '</td><td>' + allocPill(a) + '</td><td>' + action(a) + '</td></tr>').join('') : '<tr><td colspan="7" class="empty">No allocations match.</td></tr>') +
    '</tbody></table></div></section>';
  return { title: 'Allocations & movements', sub: 'Every stay on every bed. History is never overwritten.', actions: '<button type="button" class="btn primary" data-act="openModal" data-kind="allocate">' + icon('plus', 16) + 'New allocation</button>', body };
};

/* ---------- requests ---------- */
VIEWS.requests = function () {

  const body =
    '<section class="card">' + tabs('requests', [['waiting', 'Waiting for decision', S.requests.filter(groups.waiting).length], ['changes', 'Returned for changes', S.requests.filter(groups.changes).length], ['done', 'Decided', S.requests.filter(groups.done).length], ['all', 'All', S.requests.length]], tab) +

    '<div class="table-wrap"><table class="tbl"><thead><tr><th>Request</th><th>Type</th><th>Requester</th><th>Submitted</th><th>Status</th><th><span class="sr">Action</span></th></tr></thead><tbody>' +
    (list.length ? list.map((r) => '<tr class="clickable" data-act="openModal" data-kind="request" data-id="' + r.id + '"><td class="mono">' + esc(r.no) + '</td><td>' + esc(REQUEST_TYPES[r.type].name) + '</td><td>' + who(staffName(S, r.staffId), (byId(S.staff, r.staffId) || {}).empId + (r.onBehalf ? ' \u00b7 raised by admin' : '')) + '</td><td>' + fmtStamp(r.submitted) + '</td><td>' + reqPill(r) + '</td><td>' + (r.status === 'pending_approval' ? '<button type="button" class="btn sm primary" data-act="openModal" data-kind="request" data-id="' + r.id + '">Review</button>' : '<button type="button" class="btn sm" data-act="openModal" data-kind="request" data-id="' + r.id + '">View</button>') + '</td></tr>').join('') : '<tr><td colspan="6" class="empty">Nothing here.</td></tr>') +

};

VIEWS.maintenance = function () {

    ['Waiting', ['waiting_parts', 'waiting_access', 'waiting_staff']], ['Resolved, awaiting resident', ['resolved']], ['Closed', ['closed', 'cancelled']]
  ];
  const open = S.tickets.filter((t) => !['closed', 'cancelled', 'resolved'].includes(t.status));
  const list = S.tickets.filter((t) => matches('tk', t.no, t.title, byId(S.rooms, t.roomId).no, t.category, t.team));
  const body =
    '<div class="kpis">' + kpi('Open tickets', open.length) + kpi('Emergency', open.filter((t) => t.urgency === 'emergency').length) + kpi('Unassigned', open.filter((t) => !t.team).length) + kpi('Awaiting resident', S.tickets.filter((t) => t.status === 'resolved').length) + '</div>' +

    '</div></div></section>';
  return { title: 'Maintenance', sub: 'Coordinator board \u00b7 all sites', actions: '<button type="button" class="btn primary" data-act="openModal" data-kind="newTicket">' + icon('plus', 16) + 'New ticket</button>', body };
};

/* ---------- staff ---------- */
VIEWS.staff = function () {
  const dept = S.ui.tab.staffDept || '';
  const stay = S.ui.tab.staffStay || '';
  const list = S.staff.filter((s) => (!dept || s.dept === dept) && matches('staff', s.first, s.last, s.empId, s.dept)).filter((s) => {
    const a = currentAlloc(S, s.id);
    if (stay === 'bed') return !!a;
    if (stay === 'nobed') return !a;
    if (stay === 'flag') return s.employment !== 'active' && !!a;
    return true;
  });
  const empTone = { active: 'ok', notice: 'warn', on_leave: 'info', terminated: 'danger' };
  const empLabel = { active: 'Active', notice: 'Notice period', on_leave: 'On leave', terminated: 'Terminated' };
  const body = '<section class="card"><div class="form-grid">' + searchBox('staff', 'Name or employee ID') +
    '<div class="field"><label for="sf-dept">Department</label><select id="sf-dept" data-filter="staffDept"><option value="">All departments</option>' + S.departments.map((d) => '<option' + (d === dept ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label for="sf-stay">Accommodation</label><select id="sf-stay" data-filter="staffStay">' + [['', 'Any'], ['bed', 'Has a bed'], ['nobed', 'No bed'], ['flag', 'Resident but not active']].map(([v, l]) => '<option value="' + v + '"' + (v === stay ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div></div>' +
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Employee ID</th><th>Department</th><th>Current bed</th><th>Employment</th><th>Keys</th></tr></thead><tbody>' +
    (list.length ? list.map((s) => { const a = currentAlloc(S, s.id); return '<tr class="clickable" data-act="openModal" data-kind="staffProfile" data-id="' + s.id + '"><td><div class="row" style="gap:10px;flex-wrap:nowrap"><span class="avatar">' + initials(s.first + ' ' + s.last) + '</span><b>' + esc(s.first + ' ' + s.last) + '</b></div></td><td class="mono">' + esc(s.empId) + '</td><td>' + esc(s.dept) + '</td><td>' + (a ? esc(bedLabel(S, a.bedId)) + (a.status === 'confirmed' ? ' <span class="pill info">from ' + fmtDate(a.start) + '</span>' : '') : '<span class="muted">No bed</span>') + '</td><td>' + pill(empTone[s.employment], empLabel[s.employment]) + '</td><td class="num">' + keysHeldBy(S, s.id).length + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="empty">No staff match these filters.</td></tr>') +
    '</tbody></table></div></section>';
  return { title: 'Staff', sub: S.staff.length + ' people \u00b7 ' + S.staff.filter((s) => currentAlloc(S, s.id)).length + ' with a bed', actions: '<button type="button" class="btn" data-act="openModal" data-kind="import">Import from file</button><button type="button" class="btn primary" data-act="openModal" data-kind="staff">' + icon('plus', 16) + 'Add staff</button>', body };
};

/* ---------- keys ---------- */
VIEWS.keys = function () {
  const tab = S.ui.tab.keys || 'all';
  const groups = {
    all: () => true,
    available: (k) => k.status === 'available',
    issued: (k) => k.status === 'issued',
    overdue: (k) => k.status === 'issued' && k.holder && k.holder.due && k.holder.due < TODAY,

  const body =
    '<div class="kpis">' + kpi('Registered keys', S.keys.length) + kpi('Issued', S.keys.filter(groups.issued).length) + kpi('Past return date', S.keys.filter(groups.overdue).length) + kpi('Lost or damaged', S.keys.filter(groups.problems).length) + '</div>' +
    '<div class="cols"><section class="card wide">' + tabs('keys', [['all', 'All'], ['available', 'Available'], ['issued', 'Issued'], ['overdue', 'Past return date'], ['problems', 'Lost or damaged']].map(([id, n]) => [id, n, S.keys.filter(groups[id]).length]), tab) +
    '<div class="form-grid">' + searchBox('keys', 'Key code, room or holder') + '</div>' +

    (list.length ? list.slice(0, 60).map((k) => { const overdue = groups.overdue(k); return '<tr><td class="mono">' + esc(k.code) + '</td><td>' + esc(k.label) + '<div class="small muted">' + esc(label(KEY_KINDS, k.kind)) + ' \u00b7 copy ' + k.copy + '</div></td><td>' + pill(overdue ? 'warn' : KEY_TONE[k.status], overdue ? 'Overdue' : KEY_LABEL[k.status]) + '</td><td>' + esc(k.holder ? k.holder.name : (k.storage || '\u2014')) + '</td><td' + (overdue ? ' style="color:var(--warn-fg);font-weight:700"' : '') + '>' + (k.holder ? fmtDate(k.holder.due) : '\u2014') + '</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">' +
      (k.status === 'available' ? '<button type="button" class="btn sm primary" data-act="openModal" data-kind="issueKey" data-id="' + k.id + '">Issue</button>' : '') +
      (k.status === 'issued' ? '<button type="button" class="btn sm" data-act="openModal" data-kind="returnKey" data-id="' + k.id + '">Return</button>' : '') +

    '<section class="card"><h2>Key movements</h2>' + (S.keyTx.length ? S.keyTx.slice(0, 12).map((t) => '<div class="row between small" style="border-bottom:1px solid var(--line);padding-bottom:8px"><span><b>' + esc(t.type[0].toUpperCase() + t.type.slice(1)) + '</b> <span class="mono">' + esc(t.code) + '</span> \u00b7 ' + esc(t.who) + '</span><span class="muted">' + fmtStamp(t.at) + '</span></div>').join('') : '<p class="muted small">Issues, returns and incidents you record appear here. Records are never erased.</p>') + '</section></div>';
  return { title: 'Keys', sub: 'Key register and movements', actions: '<button type="button" class="btn primary" data-act="openModal" data-kind="registerKey">' + icon('plus', 16) + 'Register key</button>', body };

/* ---------- reports ---------- */
VIEWS.reports = function () {
  const rows = S.buildings.map((b) => { const c = occupancyCounts(activeBeds((r) => r.buildingId === b.id)); return { b, c }; });
  const from = S.ui.tab.repFrom || addDays(TODAY, -30);

    '<div class="kpis">' + kpi('Arrivals in period', arr) + kpi('Departures in period', dep) + kpi('Tickets raised', S.tickets.length) + kpi('Requests decided', S.requests.filter((r) => ['fulfilled', 'rejected'].includes(r.status)).length) + '</div></section>' +
    '<div class="cols"><section class="card wide"><div class="row between"><h2>Occupancy by building, today</h2><button type="button" class="btn sm" data-act="openModal" data-kind="export" data-report="occupancy">Export CSV</button></div>' +
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>Site</th><th>Building</th><th>Beds</th><th>Occupied</th><th>Reserved</th><th>Vacant</th><th>Blocked</th><th>Occupancy</th></tr></thead><tbody>' +
    rows.map(({ b, c }) => '<tr><td>' + esc(byId(S.sites, b.siteId).name) + '</td><td>' + esc(b.name) + '</td><td>' + c.total + '</td><td>' + c.occupied + '</td><td>' + c.reserved + '</td><td>' + c.vacant + '</td><td>' + c.blocked + '</td><td><div class="row" style="flex-wrap:nowrap;gap:8px"><div class="bar" style="width:90px"><i style="width:' + c.rate + '%"></i></div><b>' + c.rate + '%</b></div></td></tr>').join('') +
    '</tbody></table></div><p class="small muted">Occupancy = checked-in beds \u00f7 beds not retired, counted at midnight site time. Reserved beds are confirmed arrivals not yet checked in.</p></section>' +
    '<section class="card"><div class="row between"><h2>Maintenance by category</h2><button type="button" class="btn sm" data-act="openModal" data-kind="export" data-report="maintenance">Export CSV</button></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Category</th><th>Open</th><th>Done</th></tr></thead><tbody>' +
    Object.keys(cats).map((k) => '<tr><td>' + esc(k) + '</td><td>' + cats[k].open + '</td><td>' + cats[k].done + '</td></tr>').join('') + '</tbody></table></div></section></div>' +
    '<section class="card"><div class="row between"><h2>Movement history</h2><button type="button" class="btn sm" data-act="openModal" data-kind="export" data-report="movements">Export CSV</button></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Allocation</th><th>Staff</th><th>Bed</th><th>Start</th><th>End</th><th>Reason</th><th>Status</th></tr></thead><tbody>' +
    S.allocations.slice().sort((x, y) => (x.start < y.start ? 1 : -1)).slice(0, 15).map((a) => '<tr><td class="mono">' + esc(a.no) + '</td><td>' + esc(staffName(S, a.staffId)) + '</td><td>' + esc(bedLabel(S, a.bedId)) + '</td><td>' + fmtDate(a.start) + '</td><td>' + fmtDate(a.end) + '</td><td>' + esc(label(REASONS, a.reason)) + '</td><td>' + allocPill(a) + '</td></tr>').join('') + '</tbody></table></div></section>';
  return { title: 'Reports', sub: 'Occupancy dashboard is P0; the rest are P1', body };
};

/* ---------- administration ---------- */
VIEWS.admin = function () {
  const tab = S.ui.tab.admin || 'users';
  let inner = '';
  if (tab === 'users') {
    const stTone = { active: 'ok', invited: 'info', suspended: 'warn', deactivated: 'neutral' };
    inner = '<section class="card"><div class="row between"><h2>Users and roles</h2><button type="button" class="btn primary" data-act="openModal" data-kind="user">' + icon('plus', 16) + 'Invite user</button></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Roles</th><th>Site scope</th><th>Status</th><th>Last sign-in</th><th><span class="sr">Actions</span></th></tr></thead><tbody>' +
      S.users.map((u) => '<tr><td>' + who(u.name, u.email) + '</td><td><div class="row" style="gap:4px">' + u.roles.map((r) => '<span class="chip">' + esc(label(ROLES, r)) + '</span>').join('') + '</div></td><td>' + esc(u.scope === 'all' ? 'All sites' : u.scope === 'own' ? 'Own records' : (byId(S.sites, u.scope) || {}).name) + '</td><td>' + pill(stTone[u.status], u.status[0].toUpperCase() + u.status.slice(1)) + '</td><td class="muted">' + esc(u.last) + '</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><button type="button" class="btn sm" data-act="openModal" data-kind="user" data-id="' + u.id + '">Edit</button>' +
        (u.status === 'deactivated' ? '<button type="button" class="btn sm" data-act="userStatus" data-id="' + u.id + '" data-status="active">Reactivate</button>' : '<button type="button" class="btn sm danger" data-act="openModal" data-kind="deactivate" data-id="' + u.id + '">Deactivate</button>') + '</div></td></tr>').join('') +
      '</tbody></table></div></section>';
  } else if (tab === 'workflows') {
    inner = '<section class="card"><h2>Request types and approval routes</h2>' + Object.keys(REQUEST_TYPES).map((k) => { const w = S.workflows[k]; const t = REQUEST_TYPES[k]; return '<div class="row" style="border:1px solid var(--line);border-radius:14px;padding:14px"><div class="grow"><b>' + esc(t.name) + '</b><div class="small muted">Route version ' + w.version + ' \u00b7 on approval: ' + esc(t.action.toLowerCase()) + ' \u00b7 self-approval ' + (w.selfApproval ? 'allowed' : 'blocked') + '</div></div><div class="row" style="gap:6px">' + w.stages.map((s, i) => '<span class="chip">' + (i + 1) + '. ' + esc(s.name) + '</span>').join('') + '</div><button type="button" class="btn sm" data-act="openModal" data-kind="workflow" data-type="' + k + '">Edit route</button></div>'; }).join('') +
      '<p class="small muted">Requests already in progress keep the route version they were submitted with.</p></section>';
  } else if (tab === 'policy') {
    inner = '<form class="card" data-form="settings" novalidate><h2>Allocation policy</h2>' +
      settingRow('selfBooking', 'Staff can pick their own bed', 'Off: admins allocate beds, staff ask for room changes in the app.') +
      settingRow('openEnded', 'Allow open-ended stays', 'A stay can start without an end date.') +
      settingRow('genderEnforce', 'Enforce room gender policy', 'Allocations that break a room\u2019s gender rule need an override reason.') +
      '<div class="form-grid">' +
      '<div class="field"><label for="st-hold">Hold a bed while a request is pending</label><select id="st-hold" name="holdHours">' + [[0, 'No hold'], [24, '24 hours'], [48, '48 hours'], [72, '72 hours']].map(([v, l]) => '<option value="' + v + '"' + (S.settings.holdHours === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="st-overlap">Transfer overlap window</label><select id="st-overlap" name="transferOverlap">' + [[0, 'None, same-day move'], [1, '1 day'], [2, '2 days']].map(([v, l]) => '<option value="' + v + '"' + (S.settings.transferOverlap === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="st-reopen">Days a resident can reopen a fixed ticket</label><input type="number" id="st-reopen" name="reopenDays" min="1" max="30" value="' + S.settings.reopenDays + '"></div>' +
      '<div class="field"><span class="lbl">End date rule</span><span class="hint">The end date is the check-out day, so the bed is free for a new arrival that day.</span></div></div>' +
      '<div class="row"><button type="submit" class="btn primary">Save policy</button></div></form>';
  } else if (tab === 'reference') {
    const block = (key, title, items) => '<section class="card"><div class="row between"><h2>' + title + '</h2><button type="button" class="btn sm" data-act="openModal" data-kind="refAdd" data-list="' + key + '" data-title="' + title + '">' + icon('plus', 14) + 'Add</button></div><div class="row" style="gap:6px">' + items.map((x) => '<span class="chip">' + esc(x) + '</span>').join('') + '</div></section>';
    inner = '<div class="cols">' + block('categories', 'Maintenance categories', S.categories) + block('departments', 'Departments', S.departments) + block('companies', 'Companies', S.companies) + block('teams', 'Maintenance teams and contractors', S.teams) + '</div>' +
      '<section class="card"><h2>Room types</h2><div class="row" style="gap:6px">' + ROOM_TYPES.map((t) => '<span class="chip">' + esc(t.name) + ' \u00b7 ' + t.capacity + ' bed(s)</span>').join('') + '</div></section>';
  } else if (tab === 'delivery') {
    inner = '<section class="card"><h2>Message delivery</h2><p class="small muted">Failed messages never undo a booking or approval. Retry after fixing the address.</p><div class="table-wrap"><table class="tbl"><thead><tr><th>When</th><th>Channel</th><th>To</th><th>Message</th><th>Status</th><th><span class="sr">Action</span></th></tr></thead><tbody>' +
      '<tr><td>' + fmtStamp(stamp(-200)) + '</td><td>Email</td><td>maria.s@[client-domain]</td><td>Arrival confirmation ALC-2026-000874</td><td>' + (S.ui.tab.retried ? pill('ok', 'Sent on retry') : pill('danger', 'Bounced \u00b7 mailbox not found')) + '</td><td>' + (S.ui.tab.retried ? '' : '<button type="button" class="btn sm" data-act="retryMsg">Retry</button>') + '</td></tr>' +
      '<tr><td>' + fmtStamp(stamp(-180)) + '</td><td>Push</td><td>Ahmed Raza \u00b7 2 devices</td><td>Room change moved to stage 2</td><td>' + pill('ok', 'Delivered') + '</td><td></td></tr>' +
      '<tr><td>' + fmtStamp(stamp(-170)) + '</td><td>WhatsApp</td><td>+971 50 555 0120</td><td>Ticket update MNT-2026-000311</td><td>' + pill('neutral', 'Phase 2 (P1)') + '</td><td></td></tr></tbody></table></div></section>';
  } else {
    S.journey.audit = true;
    const list = S.audit.filter((a) => matches('audit', a.who, a.action, a.entity, a.change));
    inner = '<section class="card"><div class="form-grid">' + searchBox('audit', 'Person, action or record') + '</div><div class="table-wrap"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Change</th></tr></thead><tbody>' +
      list.slice(0, 80).map((a) => '<tr><td class="muted">' + fmtStamp(a.at) + '</td><td><b>' + esc(a.who) + '</b></td><td>' + esc(a.action) + '</td><td class="mono">' + esc(a.entity) + '</td><td class="wrap">' + esc(a.change) + '</td></tr>').join('') +
      '</tbody></table></div><p class="small muted">Append-only. Nobody can edit or delete an entry, including system admins.</p></section>';
  }
  const body = tabs('admin', [['users', 'Users & roles'], ['workflows', 'Approval routes'], ['policy', 'Allocation policy'], ['reference', 'Reference data'], ['delivery', 'Message delivery'], ['audit', 'Audit trail']], tab) + inner;
  return { title: 'Administration', sub: 'Users, approval routes, policies and the audit trail', body };
};
function settingRow(name, title, desc) {
  return '<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:nowrap"><div class="grow"><b id="lbl-' + name + '">' + esc(title) + '</b><div class="small muted">' + esc(desc) + '</div></div>' +
    '<input type="hidden" name="' + name + '" value="' + (S.settings[name] ? '1' : '') + '"><button type="button" class="switch" role="switch" aria-checked="' + !!S.settings[name] + '" aria-labelledby="lbl-' + name + '" data-act="flipSetting" data-name="' + name + '"><span></span></button></div>';
}

</script>
<script>
/* Staff Accommodation prototype: every pop-up and drawer in the management portal, plus their submit handlers. */

const btnCancel = '<button type="button" class="btn" data-act="closeModal">Cancel</button>';
const submit = (text, tone) => '<button type="submit" class="btn ' + (tone || 'primary') + '">' + esc(text) + '</button>';
const siteOpts = () => S.sites.map((s) => [s.id, s.name]);
const buildingOpts = () => S.buildings.map((b) => [b.id, byId(S.sites, b.siteId).name + ' \u00b7 ' + b.name]);
const roomOpts = () => S.rooms.map((r) => [r.id, byId(S.buildings, r.buildingId).name + ' \u00b7 ' + r.no]);
const staffOpts = (filter) => S.staff.filter(filter || (() => true)).map((s) => [s.id, s.first + ' ' + s.last + ' \u00b7 ' + s.empId]);
const done = (msg) => { S.ui.modal = null; toast(msg); };

function bedPickList(name, beds, cur, staffId, kind) {
  if (!beds.length) return '<div class="alert warn">No beds are free for these dates and filters. Change the dates or widen the filters.</div>';
  return '<div class="pick-list" role="radiogroup" aria-label="Available beds">' + beds.map((b) => {
    const r = byId(S.rooms, b.roomId);
    const occ = S.beds.filter((x) => x.roomId === r.id && bedState(S, x.id).state === 'occupied').length;
    const warn = staffId ? policyWarnings(S, staffId, b.id, kind || 'staff') : [];
    return '<label class="pick"><input type="radio" name="' + name + '" value="' + b.id + '"' + (cur === b.id ? ' checked' : '') + '><span class="grow stack tight"><b>' + esc(r.no + ' \u00b7 Bed ' + b.label) + '</b><span class="small muted">' + esc(bedWhere(S, b.id)) + ' \u00b7 ' + esc(typeName(r.typeId)) + ' \u00b7 ' + occ + ' of ' + S.beds.filter((x) => x.roomId === r.id && x.status !== 'retired').length + ' occupied</span>' +
      (warn.length ? '<span class="small" style="color:var(--warn-fg);font-weight:700">' + esc(warn.join(' ')) + '</span>' : '') + '</span>' + pill('ok', 'Free') + '</label>';
  }).join('') + '</div>';
}

/* ---------- confirm reset ---------- */
MODALS.reset = () => ({
  title: 'Reset the prototype?', size: 'narrow',
  body: '<p>This puts back the sample sites, staff and allocations and clears everything you added, including the journey checklist.</p>',
  foot: btnCancel + '<button type="button" class="btn danger" data-act="doReset">Reset everything</button>'
});

/* ---------- setup ---------- */
MODALS.site = () => ({
  title: 'Add site', sub: 'A camp, village or compound with its own timezone.', form: true,
  body: '<div class="form-grid">' + fInput('name', 'Site name', { required: true, placeholder: 'e.g. Sharjah Staff Camp' }) + fInput('code', 'Short code', { required: true, placeholder: 'SH', help: 'Unique. Used in room and key codes.' }) +
    fSelect('timezone', 'Timezone', TIMEZONES, { required: true, value: 'Asia/Dubai', help: 'All stay dates at this site use it.' }) + fSelect('status', 'Status', [['active', 'Active'], ['inactive', 'Inactive']], { value: 'active' }) +
    fText('address', 'Address', { rows: 2 }) + fInput('phone', 'Reception phone', { type: 'tel', placeholder: '+971 4 555 0000' }) + fInput('email', 'Reception email', { type: 'email' }) +
    fText('help', 'Help text shown to residents', { rows: 2, placeholder: 'Reception hours, emergency numbers' }) + '</div>',
  foot: btnCancel + submit('Create site')
});
FORMS.site = (f) => { const s = opAddSite(S, f); done('Site ' + s.name + ' created. Add a building next.'); };

MODALS.building = () => ({
  title: 'Add building', sub: 'A block, villa or apartment building inside a site.', form: true,
  body: '<div class="form-grid">' + fSelect('siteId', 'Site', siteOpts(), { required: true, value: S.sites[0].id }) + fInput('name', 'Building name', { required: true, placeholder: 'e.g. Block C' }) +
    fSelect('type', 'Type', BUILDING_TYPES, { value: 'staff_block' }) + fInput('floors', 'Floors', { type: 'number', value: '2', min: '1' }) +
    fSelect('gender', 'Gender policy', GENDER_POLICIES, { value: 'male', help: 'Rooms inherit this unless you change it per room.' }) + fSelect('status', 'Status', [['active', 'Active'], ['inactive', 'Inactive'], ['under_maintenance', 'Under maintenance']], { value: 'active' }) + '</div>',
  foot: btnCancel + submit('Create building')
});
FORMS.building = (f) => { const b = opAddBuilding(S, f); S.ui.buildingSel = b.id; done(b.name + ' created. Add its rooms next.'); };

MODALS.room = (m) => {
  const r = m.id ? byId(S.rooms, m.id) : null;
  const bId = r ? r.buildingId : (m.building || S.ui.buildingSel);
  const bld = byId(S.buildings, bId);
  const typeId = val('typeId', r ? r.typeId : 'rt_dorm4');
  const cap = val('capacity', r ? r.capacity : (ROOM_TYPES.find((t) => t.id === typeId) || {}).capacity || 2);
  return {
    title: r ? 'Edit room ' + r.no : 'Add room', sub: r ? 'Changing capacity adds beds, or retires free beds with no bookings.' : 'Beds A, B, C\u2026 and one key per bed plus a spare are created for you.', form: true,
    body: '<div class="form-grid">' + fSelect('buildingId', 'Building', buildingOpts(), { required: true, value: bId }) + fInput('no', 'Room number', { required: true, value: r ? r.no : '', placeholder: bld ? bld.name.replace('Block ', '').replace('Building ', '') + '-201' : '' }) +
      fInput('floor', 'Floor', { value: r ? r.floor : '2' }) + fSelect('typeId', 'Room type', ROOM_TYPES.map((t) => [t.id, t.name + ' (' + t.capacity + ')']), { value: typeId, act: 'formChange' }) +
      fInput('capacity', 'Beds in this room', { type: 'number', value: cap, min: '1', max: '12', required: true }) +
      fSelect('gender', 'Gender policy', GENDER_POLICIES, { value: r ? r.gender : (bld ? bld.gender : 'mixed') }) +
      fSelect('mode', 'How it is allocated', [['bed', 'Bed by bed'], ['whole_room', 'Whole room (family or supervisor)']], { value: r ? r.mode : 'bed' }) +
      fSelect('status', 'Status', [['active', 'Active'], ['blocked', 'Blocked'], ['inactive', 'Inactive'], ['retired', 'Retired']], { value: r ? r.status : 'active', help: 'Blocked and inactive rooms cannot receive new allocations.' }) +
      fInput('statusReason', 'Reason if blocked', { value: r ? r.statusReason : '', full: true }) +
      '<fieldset class="fieldset field full"><legend>Amenities</legend><div class="checks">' + AMENITIES.map(([k, l]) => fCheck('am_' + k, l, r ? r.amenities.includes(k) : ['ac', 'wardrobe', 'wifi'].includes(k))).join('') + '</div></fieldset>' +
      fText('eligibility', 'Eligibility notes', { rows: 2, value: r ? r.eligibility : '', help: 'Optional. For example: Grade 4 and above, Engineering only.' }) + '</div>',
    foot: btnCancel + submit(r ? 'Save room' : 'Create room')
  };
};
FORMS.room = (f) => {
  const m = S.ui.modal;
  const r = opSaveRoom(S, f, m.id);
  S.ui.buildingSel = r.buildingId;
  done(m.id ? 'Room ' + r.no + ' saved.' : 'Room ' + r.no + ' created with ' + r.capacity + ' beds.');
};

MODALS.block = (m) => {
  const bed = m.bed ? byId(S.beds, m.bed) : null;
  const roomId = val('roomId', bed ? bed.roomId : (S.rooms.find((r) => r.buildingId === (m.building || S.ui.buildingSel)) || S.rooms[0]).id);
  const beds = S.beds.filter((b) => b.roomId === roomId && b.status === 'active');
  const chosen = [].concat(val('bedIds', bed ? [bed.id] : beds.map((b) => b.id)));
  return {
    title: 'Block beds', sub: 'Take beds out of use for repair, cleaning, inspection or safety.', form: true,
    body: '<div class="form-grid">' + fSelect('roomId', 'Room', roomOpts(), { value: roomId, act: 'formChange' }) + fSelect('reason', 'Reason', BLOCK_REASONS, { value: 'repair' }) +
      fInput('start', 'From', { type: 'date', value: TODAY, required: true }) + fInput('end', 'Until', { type: 'date', help: 'Leave empty to block until released.' }) +
      fInput('ticketNo', 'Linked ticket', { placeholder: 'MNT-2026-\u2026' }) + fText('note', 'Note', { rows: 2 }) + '</div>' +
      '<fieldset class="fieldset"><legend>Beds</legend><div class="checks">' + beds.map((b) => { const st = bedState(S, b.id); return '<label class="check"><input type="checkbox" name="bedIds" value="' + b.id + '"' + (chosen.includes(b.id) ? ' checked' : '') + '><span>Bed ' + b.label + ' \u00b7 ' + st.state + (st.alloc ? ' (' + esc(staffName(S, st.alloc.staffId)) + ')' : '') + '</span></label>'; }).join('') + '</div></fieldset>',
    foot: btnCancel + submit('Block beds')
  };
};
FORMS.block = (f) => { opBlockBeds(S, { bedIds: [].concat(f.bedIds || []), start: f.start, end: f.end, reason: f.reason, note: f.note, ticketNo: f.ticketNo }); done('Beds blocked. They no longer appear in bed search for those dates.'); };

/* ---------- staff ---------- */
MODALS.staff = (m) => {
  const s = m.id ? byId(S.staff, m.id) : null;
  const d = (k, def) => (s ? s[k] : def);
  return {
    title: s ? 'Edit ' + s.first + ' ' + s.last : 'Add staff member', sub: 'Employee ID must be unique. Residents see and edit only their phone, email and emergency contact.', form: true, size: 'wide',
    body: '<fieldset class="fieldset"><legend>Employment</legend><div class="form-grid">' +
      fInput('empId', 'Employee ID', { required: true, value: d('empId', ''), placeholder: 'EMP-10600' }) + fInput('first', 'First name', { required: true, value: d('first', '') }) + fInput('last', 'Last name', { required: true, value: d('last', '') }) +
      fSelect('dept', 'Department', S.departments, { required: true, value: d('dept', ''), placeholder: 'Choose' }) + fSelect('company', 'Company', S.companies, { value: d('company', 'Main contractor') }) + fInput('grade', 'Grade', { value: d('grade', '') }) +
      fSelect('managerId', 'Line manager', staffOpts((x) => !s || x.id !== s.id), { value: d('managerId', 'st14'), placeholder: 'None', help: 'Used for \u201cline manager\u201d approval stages.' }) +
      fSelect('employment', 'Employment status', [['active', 'Active'], ['on_leave', 'On leave'], ['notice', 'Notice period'], ['terminated', 'Terminated']], { value: d('employment', 'active') }) +
      fInput('joinDate', 'Joining date', { type: 'date', value: d('joinDate', TODAY) }) + fInput('empEnd', 'Employment end date', { type: 'date', value: d('empEnd', ''), help: 'Required for notice period or terminated.' }) + '</div></fieldset>' +
      '<fieldset class="fieldset"><legend>Personal and contact</legend><div class="form-grid">' +
      fSelect('gender', 'Gender', [['male', 'Male'], ['female', 'Female']], { required: true, value: d('gender', ''), placeholder: 'Choose', help: 'Needed for room gender policies.' }) + fInput('nationality', 'Nationality', { value: d('nationality', ''), help: 'Only if eligibility rules need it.' }) +
      fInput('phone', 'Mobile', { type: 'tel', value: d('phone', '') }) + fInput('email', 'Email', { type: 'email', value: d('email', '') }) + '</div></fieldset>' +
      '<fieldset class="fieldset"><legend>Emergency contact</legend><div class="form-grid">' +
      fInput('emName', 'Name', { value: s ? s.emergency.name : '' }) + fInput('emRelation', 'Relationship', { value: s ? s.emergency.relation : '' }) + fInput('emPhone', 'Phone', { type: 'tel', value: s ? s.emergency.phone : '' }) + '</div></fieldset>' +
      (s ? '' : fCheck('createLogin', 'Send a resident app invitation to this person', true)),
    foot: btnCancel + submit(s ? 'Save changes' : 'Add staff member')
  };
};
FORMS.staff = (f) => {
  const m = S.ui.modal;
  const s = opSaveStaff(S, f, m.id);
  if (!m.id) { S.ui.modal = null; toast(s.first + ' ' + s.last + ' added. Allocate a bed next.'); openModal('allocate', { staffId: s.id }); return; }
  done('Changes saved.');
};

MODALS.staffProfile = (m) => {
  const s = byId(S.staff, m.id);
  const a = currentAlloc(S, s.id);
  const hist = S.allocations.filter((x) => x.staffId === s.id).sort((x, y) => (x.start < y.start ? 1 : -1));
  const reqs = S.requests.filter((r) => r.staffId === s.id);
  const keys = keysHeldBy(S, s.id);
  return {
    title: s.first + ' ' + s.last, sub: s.empId + ' \u00b7 ' + s.dept + ' \u00b7 ' + s.company, drawer: true,
    body: '<div class="stay-card"><span class="sub">Current accommodation</span><span class="big">' + (a ? esc(bedLabel(S, a.bedId)) : 'No bed') + '</span><span class="sub">' + (a ? esc(bedWhere(S, a.bedId)) + ' \u00b7 ' + ALLOC_LABEL[a.status] + ' \u00b7 ' + fmtDate(a.start) + ' to ' + fmtDate(a.end) : 'Allocate a bed to give them a place to stay.') + '</span></div>' +
      '<dl class="kv"><dt>Employment</dt><dd>' + esc(s.employment.replace('_', ' ')) + (s.empEnd ? ' \u00b7 ends ' + fmtDate(s.empEnd) : '') + '</dd><dt>Gender</dt><dd>' + esc(s.gender) + '</dd><dt>Grade</dt><dd>' + esc(s.grade || '\u2014') + '</dd><dt>Line manager</dt><dd>' + esc(s.managerId ? staffName(S, s.managerId) : '\u2014') + '</dd><dt>Mobile</dt><dd>' + esc(s.phone || '\u2014') + '</dd><dt>Email</dt><dd>' + esc(s.email || '\u2014') + '</dd><dt>Emergency</dt><dd>' + esc(s.emergency.name ? s.emergency.name + ' (' + s.emergency.relation + ') ' + s.emergency.phone : 'Not given') + '</dd><dt>Keys held</dt><dd>' + (keys.map((k) => k.code).join(', ') || 'None') + '</dd></dl>' +
      (s.employment !== 'active' && a ? '<div class="alert warn">Still resident while ' + esc(s.employment.replace('_', ' ')) + '. Plan the check-out.</div>' : '') +
      '<div class="stack tight"><h3>Stay history</h3>' + (hist.length ? hist.map((x) => '<button type="button" class="list-btn" data-act="openModal" data-kind="allocation" data-id="' + x.id + '" style="padding:8px"><span class="grow small"><b>' + esc(bedLabel(S, x.bedId)) + '</b> \u00b7 ' + fmtDate(x.start) + ' \u2013 ' + fmtDate(x.end) + (x.kind !== 'staff' ? ' \u00b7 ' + x.kind : '') + '</span>' + allocPill(x) + '</button>').join('') : '<span class="small muted">No stays yet.</span>') + '</div>' +
      '<div class="stack tight"><h3>Requests</h3>' + (reqs.length ? reqs.map((r) => '<button type="button" class="list-btn" data-act="openModal" data-kind="request" data-id="' + r.id + '" style="padding:8px"><span class="grow small"><b>' + esc(REQUEST_TYPES[r.type].name) + '</b> \u00b7 ' + esc(r.no) + '</span>' + reqPill(r) + '</button>').join('') : '<span class="small muted">No requests.</span>') + '</div>',
    foot: '<button type="button" class="btn left" data-act="openModal" data-kind="staff" data-id="' + s.id + '">Edit profile</button>' +
      (!a ? '<button type="button" class="btn primary" data-act="openModal" data-kind="allocate" data-staff="' + s.id + '">Allocate a bed</button>' : '') +
      (a && a.status === 'checked_in' ? '<button type="button" class="btn" data-act="openModal" data-kind="transfer" data-id="' + a.id + '">Transfer</button><button type="button" class="btn primary" data-act="openModal" data-kind="checkOut" data-id="' + a.id + '">Check out</button>' : '') +
      (a && a.status === 'confirmed' && a.start <= TODAY ? '<button type="button" class="btn primary" data-act="openModal" data-kind="checkIn" data-id="' + a.id + '">Check in</button>' : '')
  };
};

MODALS.import = (m) => {
